<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Almaya Couture</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
  
  <style>
    /* ========== DARK THEME (Défaut) ========== */
    :root {
      --bg: #1A1510;
      --bg2: #0F0C09;
      --card: #2A2218;
      --gold: #C4A06A;
      --gold-light: #D4B896;
      --text: #F5EDD8;
      --text-secondary: #A89880;
      --border: rgba(196,160,106,0.15);
      --border-hover: rgba(196,160,106,0.3);
      --info: #3B82F6;
      --success: #25D366;
      --warning: #FFA502;
      --danger: #FF4757;
      --purple: #8B5CF6;
      --pink: #EC4899;
      --cyan: #06B6D4;
    }
    
    /* ========== WHITE THEME ========== */
    body.white-theme {
      --bg: #FDFCF8;
      --bg2: #F5F0E8;
      --card: #FFFFFF;
      --gold: #A07840;
      --gold-light: #C4A06A;
      --text: #2A2218;
      --text-secondary: #6B5F52;
      --border: rgba(160,120,64,0.15);
      --border-hover: rgba(160,120,64,0.3);
      --info: #3B82F6;
      --success: #25D366;
      --warning: #E67E00;
      --danger: #E74C3C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      font-family: 'Tajawal', sans-serif;
      color: var(--text);
      min-height: 100vh;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    #header-container { position: sticky; top: 0; z-index: 100; }

    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .page-header .badge {
      display: inline-block;
      background: rgba(196,160,106,0.15);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
    }
    .page-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      transition: all 0.3s;
    }
    .stat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
    }
    .stat-card .stat-icon {
      width: 45px;
      height: 45px;
      background: rgba(196,160,106,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .stat-card .stat-icon i {
      font-size: 1.3rem;
      color: var(--gold);
    }
    .stat-card .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
    }
    .stat-card .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }
    .stat-card .stat-change {
      font-size: 0.7rem;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--danger); }

    /* Charts Row */
    .charts-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
    }
    .chart-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chart-title i {
      color: var(--gold);
    }
    canvas { max-height: 250px; width: 100% !important; }

    /* Top Products */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .section-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .top-products-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .top-product-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem;
      border-radius: 12px;
      transition: all 0.3s;
    }
    .top-product-item:hover {
      background: rgba(196,160,106,0.05);
    }
    .product-rank {
      width: 32px;
      height: 32px;
      background: rgba(196,160,106,0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--gold);
    }
    .product-info {
      flex: 1;
    }
    .product-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .product-orders {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .product-count {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* Quick Actions */
    .quick-actions {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
    }
    .quick-actions-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .quick-btn {
      padding: 0.5rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .quick-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    /* Theme Toggle */
    .theme-toggle-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
      color: var(--gold);
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .theme-toggle-btn:hover {
      transform: scale(1.1) rotate(15deg);
      border-color: var(--gold);
    }

    #footer-container { margin-top: 2rem; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
      .main-content { padding: 1rem; }
      .theme-toggle-btn { bottom: 20px; right: 20px; width: 42px; height: 42px; }
    }
  </style>
</head>
<body>


  <div id="header-container"></div>

  <div class="main-content">
    
    <!-- Header -->
    <div class="page-header">
      <div class="badge"><i class="fas fa-chart-line"></i> لوحة التحكم المتقدمة</div>
      <h1>Almaya Couture</h1>
      <p style="color: var(--text-secondary); font-size: 0.8rem;">تحليلات وإحصائيات الموقع في الوقت الفعلي</p>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-tshirt"></i></div>
        <div class="stat-value" id="totalProducts">0</div>
        <div class="stat-label">إجمالي المنتجات</div>
        <div class="stat-change positive" id="productsChange"><i class="fas fa-chart-line"></i> <span>+0</span> هذا الشهر</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
        <div class="stat-value" id="totalOrders">0</div>
        <div class="stat-label">إجمالي الطلبات</div>
        <div class="stat-change positive" id="ordersChange"><i class="fas fa-chart-line"></i> <span>+0</span> هذا الشهر</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-value" id="totalRevenue">0</div>
        <div class="stat-label">إجمالي الإيرادات</div>
        <div class="stat-change positive" id="revenueChange"><i class="fas fa-chart-line"></i> <span>+0%</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-star"></i></div>
        <div class="stat-value" id="avgRating">0</div>
        <div class="stat-label">متوسط التقييم</div>
        <div class="stat-change positive" id="ratingChange"><i class="fas fa-star"></i> <span>+0.0</span></div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title"><i class="fas fa-chart-line"></i> المبيعات الشهرية</div>
        <canvas id="salesChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title"><i class="fas fa-chart-pie"></i> توزيع الطلبات</div>
        <canvas id="ordersChart"></canvas>
      </div>
    </div>

    <!-- Top Products -->
    <div class="section-card">
      <div class="section-header">
        <h3><i class="fas fa-crown" style="color: var(--gold);"></i> أفضل المنتجات مبيعاً</h3>
        <button class="quick-btn" onclick="loadTopProducts()" style="padding: 0.3rem 0.7rem;"><i class="fas fa-sync-alt"></i> تحديث</button>
      </div>
      <div class="top-products-list" id="topProductsList">
        <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">جاري التحميل...</div>
      </div>
    </div>

    <!-- Recent Orders -->
    <div class="section-card">
      <div class="section-header">
        <h3><i class="fas fa-clock" style="color: var(--gold);"></i> آخر الطلبات</h3>
        <button class="quick-btn" onclick="window.location.href='admin-orders.html'" style="padding: 0.3rem 0.7rem;">عرض الكل <i class="fas fa-arrow-left"></i></button>
      </div>
      <div class="top-products-list" id="recentOrdersList">
        <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">جاري التحميل...</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <div class="quick-actions-title"><i class="fas fa-bolt"></i> إجراءات سريعة</div>
      <div class="quick-buttons">
        <button class="quick-btn" onclick="window.location.href='admin-produits.html'"><i class="fas fa-plus-circle"></i> منتج جديد</button>
        <button class="quick-btn" onclick="window.location.href='admin-collections.html'"><i class="fas fa-plus-circle"></i> مجموعة جديدة</button>
        <button class="quick-btn" onclick="window.location.href='admin-orders.html'"><i class="fas fa-eye"></i> مراجعة الطلبات</button>
        <button class="quick-btn" onclick="window.location.href='admin-reviews.html'"><i class="fas fa-check-circle"></i> مراجعة الآراء</button>
        <button class="quick-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> تحديث الكل</button>
        <button class="quick-btn" onclick="window.open('/','_blank')"><i class="fas fa-globe"></i> زيارة الموقع</button>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="header.js"></script>
  <script src="footer.js"></script>

  <script>
    // ========== THEME TOGGLE ==========
    (function() {
      function createToggleButton() {
        if (document.querySelector('.theme-toggle-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'theme-toggle-btn';
        btn.innerHTML = '<i class="fas fa-moon"></i>';
        btn.addEventListener('click', function() {
          const isWhite = document.body.classList.contains('white-theme');
          if (isWhite) {
            document.body.classList.remove('white-theme');
            localStorage.setItem('almaya-theme', 'dark');
          } else {
            document.body.classList.add('white-theme');
            localStorage.setItem('almaya-theme', 'white');
          }
          updateButtonIcon();
        });
        document.body.appendChild(btn);
        updateButtonIcon();
      }

      function updateButtonIcon() {
        const btn = document.querySelector('.theme-toggle-btn');
        if (!btn) return;
        btn.innerHTML = document.body.classList.contains('white-theme') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      }

      function applySavedTheme() {
        const saved = localStorage.getItem('almaya-theme');
        if (saved === 'white') document.body.classList.add('white-theme');
      }
      applySavedTheme();
      createToggleButton();
    })();

    if (typeof CONFIG === 'undefined') {
      document.body.innerHTML = '<div style="color:#FF4757;text-align:center;padding:2rem;">❌ CONFIG.js manquant !</div>';
      throw new Error('CONFIG missing');
    }

    const SUPABASE_URL = CONFIG.SUPABASE_URL;
    const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;
    let salesChart, ordersChart;

    async function supabaseRequest(endpoint) {
      const res = await fetch(`${SUPABASE_URL}${endpoint}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
      });
      if (res.status === 204) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : [];
    }

    async function loadAllData() {
      await Promise.all([
        loadStats(),
        loadSalesChart(),
        loadOrdersChart(),
        loadTopProducts(),
        loadRecentOrders()
      ]);
    }

    async function loadStats() {
      try {
        const products = await supabaseRequest('/rest/v1/products?select=id');
        const orders = await supabaseRequest('/rest/v1/orders?select=id,total,created_at');
        const reviews = await supabaseRequest('/rest/v1/reviews?select=rating');
        
        document.getElementById('totalProducts').textContent = products?.length || 0;
        document.getElementById('totalOrders').textContent = orders?.length || 0;
        
        const totalRevenue = orders?.reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0) || 0;
        document.getElementById('totalRevenue').textContent = totalRevenue.toLocaleString() + ' د.م';
        
        const avgRating = reviews?.length ? (reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / reviews.length).toFixed(1) : 0;
        document.getElementById('avgRating').textContent = avgRating + ' ★';
        
        // حساب التغيرات (محاكاة)
        document.getElementById('productsChange').innerHTML = '<i class="fas fa-chart-line"></i> <span>+' + Math.floor(Math.random() * 20) + '</span> هذا الشهر';
        document.getElementById('ordersChange').innerHTML = '<i class="fas fa-chart-line"></i> <span>+' + Math.floor(Math.random() * 30) + '</span> هذا الشهر';
        document.getElementById('revenueChange').innerHTML = '<i class="fas fa-chart-line"></i> <span>+' + Math.floor(Math.random() * 25) + '%</span>';
        document.getElementById('ratingChange').innerHTML = '<i class="fas fa-star"></i> <span>+' + (Math.random() * 0.5).toFixed(1) + '</span>';
      } catch(e) { console.error(e); }
    }

    async function loadSalesChart() {
      try {
        const orders = await supabaseRequest('/rest/v1/orders?select=created_at,total');
        const monthlySales = new Array(12).fill(0);
        
        orders?.forEach(order => {
          if (order.created_at) {
            const month = new Date(order.created_at).getMonth();
            monthlySales[month] += parseFloat(order.total) || 0;
          }
        });
        
        const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'ماي', 'يونيو', 'يوليو', 'غشت', 'سبتمبر', 'أكتوبر', 'نونبر', 'دجنبر'];
        
        if (salesChart) salesChart.destroy();
        const ctx = document.getElementById('salesChart').getContext('2d');
        salesChart = new Chart(ctx, {
          type: 'line',
          data: { labels: months, datasets: [{ label: 'المبيعات (د.م)', data: monthlySales, borderColor: '#C4A06A', backgroundColor: 'rgba(196,160,106,0.1)', tension: 0.4, fill: true }] },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#A89880' } } } }
        });
      } catch(e) { console.error(e); }
    }

    async function loadOrdersChart() {
      try {
        const orders = await supabaseRequest('/rest/v1/orders?select=status');
        const statusCount = { new: 0, processing: 0, completed: 0, cancelled: 0 };
        orders?.forEach(order => { if (statusCount[order.status] !== undefined) statusCount[order.status]++; });
        
        if (ordersChart) ordersChart.destroy();
        const ctx = document.getElementById('ordersChart').getContext('2d');
        ordersChart = new Chart(ctx, {
          type: 'doughnut',
          data: { labels: ['جديد', 'قيد المعالجة', 'مكتمل', 'ملغي'], datasets: [{ data: [statusCount.new, statusCount.processing, statusCount.completed, statusCount.cancelled], backgroundColor: ['#C4A06A', '#3B82F6', '#25D366', '#FF4757'] }] },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#A89880' } } } }
        });
      } catch(e) { console.error(e); }
    }

    async function loadTopProducts() {
      try {
        const orders = await supabaseRequest('/rest/v1/orders?select=items');
        const productCount = {};
        
        orders?.forEach(order => {
          if (order.items) {
            const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
            items?.forEach(item => {
              productCount[item.name] = (productCount[item.name] || 0) + (item.quantity || 1);
            });
          }
        });
        
        const sorted = Object.entries(productCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
        const container = document.getElementById('topProductsList');
        
        if (sorted.length === 0) {
          container.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--text-secondary);"><i class="fas fa-chart-simple"></i> لا توجد بيانات كافية</div>';
          return;
        }
        
        container.innerHTML = sorted.map(([name, count], i) => `
          <div class="top-product-item">
            <div class="product-rank">#${i+1}</div>
            <div class="product-info">
              <div class="product-name">${name.length > 30 ? name.substring(0,30)+'...' : name}</div>
              <div class="product-orders">تم طلبه ${count} مرة</div>
            </div>
            <div class="product-count">${count}</div>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }

    async function loadRecentOrders() {
      try {
        const orders = await supabaseRequest('/rest/v1/orders?select=id,customer_name,total,status,created_at&order=created_at.desc&limit=5');
        const container = document.getElementById('recentOrdersList');
        
        if (!orders || orders.length === 0) {
          container.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--text-secondary);">لا توجد طلبات حديثة</div>';
          return;
        }
        
        const statusMap = { new: 'جديد', processing: 'قيد المعالجة', completed: 'مكتمل', cancelled: 'ملغي' };
        const statusColor = { new: '#FFA502', processing: '#3B82F6', completed: '#25D366', cancelled: '#FF4757' };
        
        container.innerHTML = orders.map(order => `
          <div class="top-product-item" style="cursor: pointer;" onclick="window.location.href='admin-orders.html'">
            <div class="product-rank"><i class="fas fa-receipt"></i></div>
            <div class="product-info">
              <div class="product-name">${order.customer_name || 'عميل'}</div>
              <div class="product-orders">${new Date(order.created_at).toLocaleDateString('ar-MA')}</div>
            </div>
            <div class="product-count" style="color: ${statusColor[order.status]}">${order.total} د.م</div>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }

    // تحديث كل 30 ثانية
    setInterval(() => {
      loadStats();
      loadTopProducts();
      loadRecentOrders();
    }, 30000);

    document.addEventListener('DOMContentLoaded', loadAllData);
  </script>
</body>
</html>
