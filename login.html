<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Almaya Couture</title>
    <link rel="icon" href="images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="config.js"></script>
    
    <style>
        :root {
            --gold: #C4A06A;
            --gold-light: #D4B896;
            --bg: #1A1510;
            --bg-light: #231E16;
            --text: #E8DDD0;
            --text-muted: #A89880;
            --error: #C45A4A;
            --success: #25D366;
            --border: rgba(196,160,106,0.2);
            --input-bg: rgba(255,255,255,0.03);
        }
        
        body.white-theme {
            --gold: #A07840;
            --gold-light: #C4A06A;
            --bg: #FDFCF8;
            --bg-light: #FFFFFF;
            --text: #2A2218;
            --text-muted: #6B5F52;
            --border: rgba(160,120,64,0.2);
            --input-bg: rgba(0,0,0,0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1rem;
            background: rgba(196,160,106,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
        }

        .login-icon i {
            font-size: 2rem;
            color: var(--gold);
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 2.8rem 0.9rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(196,160,106,0.1);
        }

        .password-toggle {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #1A1510;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(196,160,106,0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            display: none;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .alert-error {
            background: rgba(196,90,74,0.15);
            border: 1px solid rgba(196,90,74,0.3);
            color: #E8A090;
        }

        .alert-success {
            background: rgba(37,211,102,0.15);
            border: 1px solid rgba(37,211,102,0.3);
            color: #90D48F;
        }

        .theme-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-light);
            border: 2px solid var(--border);
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
            border-color: var(--gold);
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
            .login-title { font-size: 1.3rem; }
            .theme-toggle-btn { bottom: 20px; right: 20px; width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-crown"></i>
                </div>
                <h1 class="login-title">تسجيل الدخول</h1>
                <p class="login-subtitle">مرحباً بعودتك إلى لوحة الإدارة</p>
            </div>

            <div class="alert alert-error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i> <span id="errorMessage"></span>
            </div>

            <div class="alert alert-success" id="successAlert">
                <i class="fas fa-check-circle"></i> <span id="successMessage"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <!-- تم حذف value='almayacouture@gmail.com' -->
                        <input type="email" id="email" class="form-input" placeholder="البريد الإلكتروني" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <!-- تم حذف value='admin123' -->
                        <input type="password" id="password" class="form-input" placeholder="كلمة المرور" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <button class="theme-toggle-btn" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <script>
        // ========== THEME TOGGLE ==========
        (function() {
            const themeBtn = document.getElementById('themeToggle');
            
            function applySavedTheme() {
                const saved = localStorage.getItem('almaya-theme');
                if (saved === 'white') {
                    document.body.classList.add('white-theme');
                    themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    document.body.classList.remove('white-theme');
                    themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                }
            }

            function toggleTheme() {
                const isWhite = document.body.classList.contains('white-theme');
                if (isWhite) {
                    document.body.classList.remove('white-theme');
                    localStorage.setItem('almaya-theme', 'dark');
                    themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                } else {
                    document.body.classList.add('white-theme');
                    localStorage.setItem('almaya-theme', 'white');
                    themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                }
            }

            themeBtn.addEventListener('click', toggleTheme);
            applySavedTheme();
        })();

        // ========== التحقق من وجود CONFIG ==========
        if (typeof CONFIG === 'undefined') {
            document.body.innerHTML = '<div style="color:#FF4757;text-align:center;padding:2rem;">❌ ملف التكوين مفقود</div>';
            throw new Error('CONFIG missing');
        }

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;

        // ========== دوال مساعدة ==========
        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }

        function showError(message) {
            hideAlerts();
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorAlert.style.display = 'flex';
            setTimeout(() => {
                errorAlert.style.display = 'none';
            }, 4000);
        }

        function showSuccess(message) {
            hideAlerts();
            const successAlert = document.getElementById('successAlert');
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successAlert.style.display = 'flex';
        }

        // ========== دالة تشفير كلمة المرور (SHA-256) ==========
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // ========== دالة الاتصال بـ Supabase ==========
        async function supabaseRequest(endpoint, opts = {}) {
            try {
                const res = await fetch(`${SUPABASE_URL}${endpoint}`, {
                    method: opts.method || 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: opts.body ? JSON.stringify(opts.body) : undefined
                });
                
                if (res.status === 204) return null;
                if (res.status === 404) return [];
                
                const data = await res.json();
                if (!res.ok) {
                    console.error('API Error:', data);
                    throw new Error(data.message || `خطأ ${res.status}`);
                }
                return data;
            } catch(e) {
                console.error('Supabase error:', e);
                throw e;
            }
        }

        // ========== دالة تسجيل الدخول ==========
        async function login(email, password) {
            try {
                // البحث عن المسؤول
                const admins = await supabaseRequest(
                    `/rest/v1/admins?email=eq.${encodeURIComponent(email)}&select=id,username,email,password_hash,full_name,role,is_active`
                );
                
                if (!admins || admins.length === 0) {
                    return { success: false, error: 'البريد الإلكتروني غير مسجل' };
                }

                const admin = admins[0];
                
                if (!admin.is_active) {
                    return { success: false, error: 'الحساب معطل. يرجى التواصل مع الدعم الفني' };
                }

                // تشفير كلمة المرور المدخلة
                const hashedPassword = await hashPassword(password);
                
                // مقارنة التشفير
                if (hashedPassword === admin.password_hash) {
                    // تحديث آخر تسجيل دخول
                    await supabaseRequest(`/rest/v1/admins?id=eq.${admin.id}`, {
                        method: 'PATCH',
                        body: { last_login: new Date().toISOString() }
                    }).catch(e => console.log('Update error:', e));
                    
                    // حفظ الجلسة
                    sessionStorage.setItem('admin_logged_in', 'true');
                    sessionStorage.setItem('admin_id', admin.id);
                    sessionStorage.setItem('admin_name', admin.full_name || admin.username);
                    sessionStorage.setItem('admin_email', admin.email);
                    sessionStorage.setItem('admin_role', admin.role);
                    
                    return { success: true, admin };
                } else {
                    return { success: false, error: 'كلمة المرور غير صحيحة' };
                }
            } catch(e) {
                console.error('Login error:', e);
                return { success: false, error: 'حدث خطأ في الاتصال بقاعدة البيانات: ' + e.message };
            }
        }

        // ========== التحقق من الجلسة ==========
        function checkSession() {
            const loggedIn = sessionStorage.getItem('admin_logged_in');
            if (loggedIn === 'true') {
                window.location.href = 'dashbord.html';
            }
        }

        // ========== إعداد النموذج ==========
        const form = document.getElementById('loginForm');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const emailInput = document.getElementById('email');
        const loginBtn = document.getElementById('loginBtn');

        // إظهار/إخفاء كلمة المرور
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // معالجة إرسال النموذج
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email) {
                showError('يرجى إدخال البريد الإلكتروني');
                return;
            }
            
            if (!password) {
                showError('يرجى إدخال كلمة المرور');
                return;
            }

            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            loginBtn.disabled = true;

            try {
                const result = await login(email, password);
                
                if (result.success) {
                    showSuccess(`مرحباً ${result.admin.full_name || result.admin.username}! جاري التحويل...`);
                    setTimeout(() => {
                        window.location.href = 'dashbord.html';
                    }, 1500);
                } else {
                    showError(result.error);
                }
            } catch (err) {
                showError('حدث خطأ غير متوقع: ' + err.message);
            } finally {
                loginBtn.innerHTML = originalText;
                loginBtn.disabled = false;
            }
        });

        // التحقق من الجلسة عند التحميل
        checkSession();
        
       
    </script>
</body>
</html>
