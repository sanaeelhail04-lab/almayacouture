<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزون | Almaya Couture</title>
    <link rel="icon" href="images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="config.js"></script>
    <script src="admin.js"></script>
    
    <style>
        /* ========== ألوان متوافقة مع الموقع ========== */
        :root {
            --gold: #C4A06A;
            --gold-light: #D4B896;
            --gold-dim: rgba(196,160,106,0.15);
            --bg: #1A1510;
            --bg2: #221C14;
            --card: #2A2218;
            --text: #E8DDD0;
            --text-secondary: #A89880;
            --text-muted: #6B5F52;
            --border: rgba(196,160,106,0.12);
            --success: #25D366;
            --danger: #FF4757;
            --warning: #FFA502;
            --info: #3B82F6;
        }
        
        body.white-theme {
            --gold: #A07840;
            --bg: #FDFCF8;
            --bg2: #F5F0E8;
            --card: #FFFFFF;
            --text: #2A2218;
            --text-secondary: #6B5F52;
            --text-muted: #8B7B68;
            --border: rgba(160,120,64,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .main-content { flex: 1; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* ========== HEADER ========== */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-header .badge {
            display: inline-block;
            background: var(--gold-dim);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* ========== STATS ========== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            background: var(--gold-dim);
        }
        .stat-card i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold);
        }
        .stat-card .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .stat-card.warning .number { color: var(--warning); }
        .stat-card.danger .number { color: var(--danger); }

        /* ========== BUTTONS ========== */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--gold);
            color: #1A1510;
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--gold-dim);
        }
        .btn-danger {
            background: rgba(255,71,87,0.12);
            color: var(--danger);
            border: 1px solid rgba(255,71,87,0.2);
        }
        .btn-danger:hover {
            background: rgba(255,71,87,0.2);
            transform: translateY(-1px);
        }
        .btn-success {
            background: rgba(37,211,102,0.12);
            color: var(--success);
            border: 1px solid rgba(37,211,102,0.2);
        }
        .btn-success:hover {
            background: rgba(37,211,102,0.2);
            transform: translateY(-1px);
        }

        /* ========== SEARCH & FILTER ========== */
        .search-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--gold);
        }
        .search-bar select {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* ========== TABLE ========== */
        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th {
            text-align: right;
            padding: 1rem;
            background: var(--bg2);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            vertical-align: middle;
        }
        tr:hover td {
            background: var(--gold-dim);
        }
        .stock-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .stock-high { background: rgba(37,211,102,0.15); color: var(--success); }
        .stock-medium { background: rgba(255,165,2,0.15); color: var(--warning); }
        .stock-low { background: rgba(255,71,87,0.15); color: var(--danger); }
        .stock-out { background: rgba(255,71,87,0.25); color: var(--danger); }

        .stock-input {
            width: 80px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.3rem 0.5rem;
            color: var(--text);
            font-family: inherit;
            text-align: center;
        }
        .stock-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            color: var(--gold);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close:hover {
            color: var(--gold);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--gold);
            margin-bottom: 0.3rem;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* ========== TOAST ========== */
        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            z-index: 1001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .toast-message.success { border-right: 3px solid var(--success); color: var(--success); }
        .toast-message.error { border-right: 3px solid var(--danger); color: var(--danger); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
            .container { padding: 1rem; }
            .search-bar { flex-direction: column; }
            .search-bar input, .search-bar select { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="main-content">
        <div class="container">
            
            <div class="page-header">
                <div class="badge"><i class="fas fa-boxes"></i> إدارة المخزون</div>
                <h1>المخزون</h1>
                <p>إدارة كميات المنتجات ومتابعة المخزون</p>
            </div>

            <!-- إحصائيات -->
            <div class="stats-row">
                <div class="stat-card">
                    <i class="fas fa-box"></i>
                    <div class="number" id="totalProducts">0</div>
                    <div class="label">إجمالي المنتجات</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-chart-line"></i>
                    <div class="number" id="totalStock">0</div>
                    <div class="label">إجمالي القطع</div>
                </div>
                <div class="stat-card warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div class="number" id="lowStock">0</div>
                    <div class="label">مخزون منخفض (&lt;10)</div>
                </div>
                <div class="stat-card danger">
                    <i class="fas fa-ban"></i>
                    <div class="number" id="outStock">0</div>
                    <div class="label">نفذ المخزون</div>
                </div>
            </div>

            <!-- بحث وتصفية -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="بحث عن منتج..." onkeyup="filterProducts()">
                <select id="categoryFilter" onchange="filterProducts()">
                    <option value="all">جميع التصنيفات</option>
                </select>
                <select id="stockFilter" onchange="filterProducts()">
                    <option value="all">جميع المنتجات</option>
                    <option value="low">مخزون منخفض</option>
                    <option value="out">نفذ المخزون</option>
                    <option value="high">مخزون جيد</option>
                </select>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> إضافة منتج
                </button>
            </div>

            <!-- جدول المخزون -->
            <div class="table-container">
                <div id="productsTable">
                    <div class="loader"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- مودال إضافة/تعديل -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-plus"></i> إضافة منتج</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalContent">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> اسم المنتج</label>
                    <input type="text" id="productName" placeholder="اسم المنتج">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-layer-group"></i> التصنيف</label>
                    <select id="productCategory">
                        <option value="جلابة">جلابة</option>
                        <option value="قفطان">قفطان</option>
                        <option value="تاكشيتا">تاكشيتا</option>
                        <option value="إكسسوارات">إكسسوارات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-barcode"></i> SKU (رمز المنتج)</label>
                    <input type="text" id="productSku" placeholder="SKU-001">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-cubes"></i> الكمية المتاحة</label>
                    <input type="number" id="productStock" value="0" min="0">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-dollar-sign"></i> السعر</label>
                    <input type="number" id="productPrice" value="0" min="0">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-image"></i> رابط الصورة (اختياري)</label>
                    <input type="text" id="productImage" placeholder="https://...">
                </div>
                <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
                    <button class="btn btn-primary" id="saveBtn" onclick="saveProduct()">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تعديل الكمية -->
    <div class="modal-overlay" id="stockModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> تعديل الكمية</h3>
                <button class="modal-close" onclick="closeStockModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="form-group">
                <label>المنتج: <span id="stockProductName"></span></label>
                <input type="number" id="newStockValue" class="stock-input" style="width: 100%; margin-top: 0.5rem;">
            </div>
            <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="closeStockModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="updateStock()">تحديث</button>
            </div>
        </div>
    </div>

    <div class="toast-message" id="toastMessage"></div>

    <script src="header.js"></script>
    <script src="footer.js"></script>

    <script>
        // التحقق من تسجيل الدخول
        if (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }

        // ========== CONFIG ==========
        if (typeof CONFIG === 'undefined') {
            showToast('❌ CONFIG.js مفقود', 'error');
            throw new Error('CONFIG missing');
        }

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;
        let allProducts = [];
        let editingId = null;
        let currentStockProductId = null;

        // ========== دالة عرض الإشعارات ==========
        function showToast(text, type) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = text;
            toast.className = `toast-message ${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ========== طلب Supabase ==========
        async function supabaseRequest(endpoint, opts = {}) {
            try {
                const url = `${SUPABASE_URL}${endpoint}`;
                const res = await fetch(url, {
                    method: opts.method || 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: opts.body ? JSON.stringify(opts.body) : undefined
                });
                
                if (res.status === 204) return null;
                if (res.status === 404) return [];
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || `خطأ ${res.status}`);
                return data;
            } catch(e) {
                console.error('❌ خطأ:', e);
                throw e;
            }
        }

        // ========== تحميل المنتجات ==========
        async function loadProducts() {
            const container = document.getElementById('productsTable');
            container.innerHTML = '<div class="loader"></div>';
            
            try {
                const products = await supabaseRequest('/rest/v1/products?select=*&order=created_at.desc');
                allProducts = products || [];
                updateStats();
                loadCategories();
                renderProducts();
            } catch(e) {
                console.error('❌ خطأ:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>خطأ في تحميل البيانات</p>
                        <button class="btn btn-primary" style="margin-top:1rem;" onclick="loadProducts()">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
                showToast('❌ خطأ في تحميل البيانات', 'error');
            }
        }

        // ========== تحديث الإحصائيات ==========
        function updateStats() {
            const total = allProducts.length;
            const totalStock = allProducts.reduce((sum, p) => sum + (p.stock || 0), 0);
            const lowStock = allProducts.filter(p => (p.stock || 0) > 0 && (p.stock || 0) < 10).length;
            const outStock = allProducts.filter(p => (p.stock || 0) === 0).length;
            
            document.getElementById('totalProducts').textContent = total;
            document.getElementById('totalStock').textContent = totalStock;
            document.getElementById('lowStock').textContent = lowStock;
            document.getElementById('outStock').textContent = outStock;
        }

        // ========== تحميل التصنيفات ==========
        function loadCategories() {
            const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
            const select = document.getElementById('categoryFilter');
            const existing = select.innerHTML;
            select.innerHTML = '<option value="all">جميع التصنيفات</option>';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        // ========== عرض المنتجات ==========
        function renderProducts() {
            let filtered = [...allProducts];
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const category = document.getElementById('categoryFilter')?.value || 'all';
            const stockFilter = document.getElementById('stockFilter')?.value || 'all';
            
            if (search) {
                filtered = filtered.filter(p => p.name?.toLowerCase().includes(search));
            }
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }
            if (stockFilter === 'low') {
                filtered = filtered.filter(p => (p.stock || 0) > 0 && (p.stock || 0) < 10);
            } else if (stockFilter === 'out') {
                filtered = filtered.filter(p => (p.stock || 0) === 0);
            } else if (stockFilter === 'high') {
                filtered = filtered.filter(p => (p.stock || 0) >= 10);
            }
            
            const container = document.getElementById('productsTable');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>لا توجد منتجات</p></div>`;
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>المنتج</th>
                            <th>التصنيف</th>
                            <th>SKU</th>
                            <th>السعر</th>
                            <th>الكمية</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map(product => {
                            const stock = product.stock || 0;
                            let stockClass = 'stock-high';
                            let stockText = 'مخزون جيد';
                            if (stock === 0) {
                                stockClass = 'stock-out';
                                stockText = 'نفذ المخزون';
                            } else if (stock < 10) {
                                stockClass = 'stock-low';
                                stockText = 'مخزون منخفض';
                            } else if (stock < 20) {
                                stockClass = 'stock-medium';
                                stockText = 'مخزون متوسط';
                            }
                            return `
                                <tr>
                                    <td><img src="${product.image || 'images/logo.jpg'}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 8px;" onerror="this.src='images/logo.jpg'"></td>
                                    <td><strong>${escapeHtml(product.name)}</strong></td>
                                    <td>${escapeHtml(product.category || '-')}</td>
                                    <td><code style="font-size:0.7rem;">${escapeHtml(product.sku || '-')}</code></td>
                                    <td>${product.price ? product.price.toLocaleString() + ' د.م' : '-'}</td>
                                    <td>
                                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                                            <span style="font-weight: 700; font-size: 1.1rem;">${stock}</span>
                                            <button class="btn btn-outline" onclick="openStockModal(${product.id}, '${escapeHtml(product.name).replace(/'/g, "\\'")}', ${stock})" style="padding:0.2rem 0.5rem;">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                        </div>
                                    </td>
                                    <td><span class="stock-badge ${stockClass}">${stockText}</span></td>
                                    <td style="white-space: nowrap;">
                                        <button class="btn btn-info" onclick="editProduct(${product.id})" style="padding:0.3rem 0.6rem;" title="تعديل">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn btn-danger" onclick="deleteProduct(${product.id})" style="padding:0.3rem 0.6rem;" title="حذف">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        // ========== تصفية المنتجات ==========
        function filterProducts() {
            renderProducts();
        }

        // ========== فتح مودال الإضافة ==========
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus"></i> إضافة منتج';
            document.getElementById('productName').value = '';
            document.getElementById('productCategory').value = 'جلابة';
            document.getElementById('productSku').value = '';
            document.getElementById('productStock').value = 0;
            document.getElementById('productPrice').value = 0;
            document.getElementById('productImage').value = '';
            document.getElementById('productModal').classList.add('active');
        }

        // ========== تعديل منتج ==========
        async function editProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;
            
            editingId = id;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل المنتج';
            document.getElementById('productName').value = product.name || '';
            document.getElementById('productCategory').value = product.category || 'جلابة';
            document.getElementById('productSku').value = product.sku || '';
            document.getElementById('productStock').value = product.stock || 0;
            document.getElementById('productPrice').value = product.price || 0;
            document.getElementById('productImage').value = product.image || '';
            document.getElementById('productModal').classList.add('active');
        }

        // ========== حفظ المنتج ==========
        async function saveProduct() {
            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                sku: document.getElementById('productSku').value,
                stock: parseInt(document.getElementById('productStock').value) || 0,
                price: parseFloat(document.getElementById('productPrice').value) || 0,
                image: document.getElementById('productImage').value || null,
                updated_at: new Date().toISOString()
            };
            
            if (!productData.name) {
                showToast('❌ الرجاء إدخال اسم المنتج', 'error');
                return;
            }
            
            try {
                if (editingId) {
                    await supabaseRequest(`/rest/v1/products?id=eq.${editingId}`, {
                        method: 'PATCH',
                        body: productData
                    });
                    showToast('✅ تم تحديث المنتج بنجاح', 'success');
                } else {
                    productData.created_at = new Date().toISOString();
                    await supabaseRequest('/rest/v1/products', {
                        method: 'POST',
                        body: productData
                    });
                    showToast('✅ تم إضافة المنتج بنجاح', 'success');
                }
                closeModal();
                await loadProducts();
            } catch(e) {
                showToast('❌ خطأ في الحفظ: ' + e.message, 'error');
            }
        }

        // ========== فتح مودال تعديل الكمية ==========
        function openStockModal(id, name, currentStock) {
            currentStockProductId = id;
            document.getElementById('stockProductName').textContent = name;
            document.getElementById('newStockValue').value = currentStock;
            document.getElementById('stockModal').classList.add('active');
        }

        // ========== تحديث الكمية ==========
        async function updateStock() {
            const newStock = parseInt(document.getElementById('newStockValue').value) || 0;
            
            try {
                await supabaseRequest(`/rest/v1/products?id=eq.${currentStockProductId}`, {
                    method: 'PATCH',
                    body: { stock: newStock, updated_at: new Date().toISOString() }
                });
                showToast('✅ تم تحديث الكمية بنجاح', 'success');
                closeStockModal();
                await loadProducts();
            } catch(e) {
                showToast('❌ خطأ في التحديث: ' + e.message, 'error');
            }
        }

        // ========== حذف منتج ==========
        async function deleteProduct(id) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا المنتج نهائياً؟')) return;
            
            try {
                await supabaseRequest(`/rest/v1/products?id=eq.${id}`, { method: 'DELETE' });
                showToast('🗑 تم حذف المنتج بنجاح', 'success');
                await loadProducts();
            } catch(e) {
                showToast('❌ خطأ في الحذف: ' + e.message, 'error');
            }
        }

        // ========== إغلاق المودال ==========
        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            editingId = null;
        }
        
        function closeStockModal() {
            document.getElementById('stockModal').classList.remove('active');
            currentStockProductId = null;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // تصدير الدوال العامة
        window.loadProducts = loadProducts;
        window.filterProducts = filterProducts;
        window.openAddModal = openAddModal;
        window.editProduct = editProduct;
        window.saveProduct = saveProduct;
        window.openStockModal = openStockModal;
        window.updateStock = updateStock;
        window.deleteProduct = deleteProduct;
        window.closeModal = closeModal;
        window.closeStockModal = closeStockModal;

        // تحميل البيانات
        loadProducts();
    </script>
</body>
</html>
