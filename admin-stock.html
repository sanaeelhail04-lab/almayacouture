<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزون | Almaya Couture</title>
    <link rel="icon" href="images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="admin.js"></script>
    
    <style>
        :root {
            --gold: #C4A06A;
            --gold-light: #D4B896;
            --gold-dim: rgba(196,160,106,0.15);
            --bg: #1A1510;
            --bg2: #221C14;
            --card: #2A2218;
            --text: #E8DDD0;
            --text-secondary: #A89880;
            --text-muted: #6B5F52;
            --border: rgba(196,160,106,0.12);
            --success: #25D366;
            --danger: #FF4757;
            --warning: #FFA502;
            --info: #3B82F6;
        }
        
        body.white-theme {
            --gold: #A07840;
            --bg: #FDFCF8;
            --bg2: #F5F0E8;
            --card: #FFFFFF;
            --text: #2A2218;
            --text-secondary: #6B5F52;
            --text-muted: #8B7B68;
            --border: rgba(160,120,64,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .main-content { flex: 1; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-header .badge {
            display: inline-block;
            background: var(--gold-dim);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            background: var(--gold-dim);
        }
        .stat-card i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold);
        }
        .stat-card .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .stat-card.warning .number { color: var(--warning); }
        .stat-card.danger .number { color: var(--danger); }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--gold);
            color: #1A1510;
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--gold-dim);
        }
        .btn-danger {
            background: rgba(255,71,87,0.12);
            color: var(--danger);
            border: 1px solid rgba(255,71,87,0.2);
        }
        .btn-danger:hover {
            background: rgba(255,71,87,0.2);
            transform: translateY(-1px);
        }
        .btn-info {
            background: rgba(59,130,246,0.12);
            color: var(--info);
            border: 1px solid rgba(59,130,246,0.2);
        }
        .btn-info:hover {
            background: rgba(59,130,246,0.2);
            transform: translateY(-1px);
        }

        .search-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 2;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--gold);
        }
        .search-bar select {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            min-width: 120px;
        }
        .search-bar .btn-primary {
            margin-right: auto;
        }

        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }
        th {
            text-align: right;
            padding: 1rem;
            background: var(--bg2);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            vertical-align: middle;
        }
        tr:hover td {
            background: var(--gold-dim);
        }
        .product-image {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--bg2);
        }
        .stock-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .stock-high { background: rgba(37,211,102,0.15); color: var(--success); }
        .stock-medium { background: rgba(255,165,2,0.15); color: var(--warning); }
        .stock-low { background: rgba(255,71,87,0.15); color: var(--danger); }
        .stock-out { background: rgba(255,71,87,0.25); color: var(--danger); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            color: var(--gold);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close:hover {
            color: var(--gold);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            z-index: 1001;
            animation: slideIn 0.3s ease;
            display: none;
            font-size: 0.85rem;
        }
        .toast-message.success { border-right: 3px solid var(--success); color: var(--success); }
        .toast-message.error { border-right: 3px solid var(--danger); color: var(--danger); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .action-buttons {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .action-buttons button {
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
        }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
            .container { padding: 1rem; }
            .search-bar { flex-direction: column; }
            .search-bar input, .search-bar select { width: 100%; }
            .search-bar .btn-primary { margin-right: 0; }
        }
    </style>
</head>
<body>

    <div id="admin-navbar-placeholder"></div>

    <div class="main-content">
        <div class="container">
            
            <div class="page-header">
                <div class="badge"><i class="fas fa-boxes"></i> إدارة المخزون</div>
                <h1>المخزون</h1>
                <p>إدارة كميات المنتجات ومتابعة المخزون</p>
            </div>

            <div class="stats-row">
                <div class="stat-card" onclick="filterByStock('all')">
                    <i class="fas fa-box"></i>
                    <div class="number" id="totalProducts">0</div>
                    <div class="label">إجمالي المنتجات</div>
                </div>
                <div class="stat-card" onclick="filterByStock('all')">
                    <i class="fas fa-chart-line"></i>
                    <div class="number" id="totalStock">0</div>
                    <div class="label">إجمالي القطع</div>
                </div>
                <div class="stat-card warning" onclick="filterByStock('low')">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div class="number" id="lowStock">0</div>
                    <div class="label">مخزون منخفض (&lt;10)</div>
                </div>
                <div class="stat-card danger" onclick="filterByStock('out')">
                    <i class="fas fa-ban"></i>
                    <div class="number" id="outStock">0</div>
                    <div class="label">نفذ المخزون</div>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 بحث عن منتج..." onkeyup="filterProducts()">
                <select id="categoryFilter" onchange="filterProducts()">
                    <option value="all">📂 جميع التصنيفات</option>
                </select>
                <select id="stockFilter" onchange="filterProducts()">
                    <option value="all">📊 جميع المنتجات</option>
                    <option value="low">⚠️ مخزون منخفض</option>
                    <option value="out">❌ نفذ المخزون</option>
                    <option value="high">✅ مخزون جيد</option>
                </select>
                <button class="btn btn-primary" onclick="goToAddProduct()">
                    <i class="fas fa-plus"></i> إضافة منتج
                </button>
            </div>

            <div class="table-container">
                <div id="productsTable">
                    <div class="loader"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تعديل الكمية السريع -->
    <div class="modal-overlay" id="stockModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> تعديل الكمية</h3>
                <button class="modal-close" onclick="closeStockModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="form-group">
                <label>المنتج: <strong id="stockProductName" style="color: var(--gold);"></strong></label>
                <input type="number" id="newStockValue" style="width: 100%; margin-top: 0.5rem; padding: 0.7rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
            </div>
            <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="closeStockModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="updateStock()">تحديث</button>
            </div>
        </div>
    </div>

    <div class="toast-message" id="toastMessage"></div>
<script src="header.js"></script>
<script src="footer.js"></script>
    <script>
        (function() {
            // التحقق من تسجيل الدخول
            if (typeof sessionStorage !== 'undefined') {
                if (sessionStorage.getItem('admin_logged_in') !== 'true' && 
                    sessionStorage.getItem('isAdmin') !== 'true') {
                    window.location.href = 'login.html';
                    return;
                }
            }

            if (typeof CONFIG === 'undefined') {
                document.body.innerHTML = '<div style="color:#FF4757;text-align:center;padding:2rem;">❌ config.js مفقود</div>';
                throw new Error('CONFIG missing');
            }

            const SUPABASE_URL = CONFIG.SUPABASE_URL;
            const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;
            let allProducts = [];
            let currentStockProductId = null;

            function showToast(text, type) {
                const toast = document.getElementById('toastMessage');
                if (!toast) return;
                toast.textContent = text;
                toast.className = `toast-message ${type}`;
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 3000);
            }

            async function supabaseRequest(endpoint, opts = {}) {
                try {
                    const url = `${SUPABASE_URL}${endpoint}`;
                    const res = await fetch(url, {
                        method: opts.method || 'GET',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: opts.body ? JSON.stringify(opts.body) : undefined
                    });
                    if (res.status === 204) return null;
                    if (res.status === 404) return [];
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || `خطأ ${res.status}`);
                    return data;
                } catch(e) {
                    console.error('❌ خطأ:', e);
                    throw e;
                }
            }

            async function loadProducts() {
                const container = document.getElementById('productsTable');
                if (container) container.innerHTML = '<div class="loader"></div>';
                
                try {
                    const products = await supabaseRequest('/rest/v1/products?select=*&order=created_at.desc');
                    allProducts = products || [];
                    updateStats();
                    loadCategories();
                    renderProducts();
                } catch(e) {
                    console.error(e);
                    if (container) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-exclamation-triangle"></i>
                                <p>خطأ في تحميل البيانات</p>
                                <button class="btn btn-primary" style="margin-top:1rem;" onclick="location.reload()">
                                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                                </button>
                            </div>
                        `;
                    }
                    showToast('❌ خطأ في تحميل البيانات', 'error');
                }
            }

            function updateStats() {
                const total = allProducts.length;
                const totalStock = allProducts.reduce((sum, p) => sum + (p.stock_quantity || p.stock || 0), 0);
                const lowStock = allProducts.filter(p => {
                    const stock = p.stock_quantity || p.stock || 0;
                    return stock > 0 && stock < 10;
                }).length;
                const outStock = allProducts.filter(p => (p.stock_quantity || p.stock || 0) === 0).length;
                
                const elTotal = document.getElementById('totalProducts');
                const elTotalStock = document.getElementById('totalStock');
                const elLowStock = document.getElementById('lowStock');
                const elOutStock = document.getElementById('outStock');
                if (elTotal) elTotal.textContent = total;
                if (elTotalStock) elTotalStock.textContent = totalStock;
                if (elLowStock) elLowStock.textContent = lowStock;
                if (elOutStock) elOutStock.textContent = outStock;
            }

            function loadCategories() {
                const categories = [...new Set(allProducts.map(p => p.category_name).filter(Boolean))];
                const select = document.getElementById('categoryFilter');
                if (select) {
                    select.innerHTML = '<option value="all">📂 جميع التصنيفات</option>';
                    categories.forEach(cat => {
                        select.innerHTML += `<option value="${cat}">${cat}</option>`;
                    });
                }
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>]/g, m => {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function renderProducts() {
                let filtered = [...allProducts];
                const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
                const category = document.getElementById('categoryFilter')?.value || 'all';
                const stockFilter = document.getElementById('stockFilter')?.value || 'all';
                
                if (search) filtered = filtered.filter(p => p.product_name?.toLowerCase().includes(search));
                if (category !== 'all') filtered = filtered.filter(p => p.category_name === category);
                if (stockFilter === 'low') filtered = filtered.filter(p => {
                    const stock = p.stock_quantity || p.stock || 0;
                    return stock > 0 && stock < 10;
                });
                else if (stockFilter === 'out') filtered = filtered.filter(p => (p.stock_quantity || p.stock || 0) === 0);
                else if (stockFilter === 'high') filtered = filtered.filter(p => (p.stock_quantity || p.stock || 0) >= 10);
                
                const container = document.getElementById('productsTable');
                if (!container) return;
                
                if (filtered.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>لا توجد منتجات</p></div>`;
                    return;
                }
                
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>الصورة</th><th>المنتج</th><th>التصنيف</th><th>SKU</th><th>السعر</th><th>الكمية</th><th>الحالة</th><th>إجراءات</th></tr>
                        </thead>
                        <tbody>
                            ${filtered.map(product => {
                                const stock = product.stock_quantity || product.stock || 0;
                                let stockClass = 'stock-high', stockText = 'مخزون جيد';
                                if (stock === 0) { stockClass = 'stock-out'; stockText = 'نفذ المخزون'; }
                                else if (stock < 10) { stockClass = 'stock-low'; stockText = 'مخزون منخفض'; }
                                else if (stock < 20) { stockClass = 'stock-medium'; stockText = 'مخزون متوسط'; }
                                
                                return `
                                    <tr>
                                        <td><img src="${escapeHtml(product.product_image_url) || 'images/logo.jpg'}" class="product-image" onerror="this.src='images/logo.jpg'"></td>
                                        <td><strong>${escapeHtml(product.product_name)}</strong><br><small style="color: var(--text-muted);">${escapeHtml(product.sub_category || '')}</small></td>
                                        <td>${escapeHtml(product.category_name || '-')}</td>
                                        <td><code style="font-size:0.7rem;">${escapeHtml(product.sku || '-')}</code></td>
                                        <td>${escapeHtml(product.price_range || '-')}</td>
                                        <td><div style="display: flex; align-items: center; gap: 0.5rem;"><span style="font-weight: 700; font-size: 1rem;">${stock}</span><button class="btn btn-outline" onclick="openStockModal(${product.id}, '${escapeHtml(product.product_name).replace(/'/g, "\\'")}', ${stock})" style="padding:0.2rem 0.5rem;"><i class="fas fa-edit"></i></button></div></td>
                                        <td><span class="stock-badge ${stockClass}">${stockText}</span></td>
                                        <td class="action-buttons">
                                            <button class="btn btn-info" onclick="goToEditProduct(${product.id})" title="تعديل"><i class="fas fa-edit"></i></button>
                                            <button class="btn btn-danger" onclick="deleteProduct(${product.id})" title="حذف"><i class="fas fa-trash-alt"></i></button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            }

            // الانتقال إلى صفحة إضافة منتج
            window.goToAddProduct = function() {
                window.location.href = 'admin-add-product.html';
            };

            // الانتقال إلى صفحة تعديل منتج
            window.goToEditProduct = function(id) {
                window.location.href = `admin-add-product.html?edit=${id}`;
            };

            window.filterProducts = function() { renderProducts(); };
            
            window.filterByStock = function(type) {
                const stockSelect = document.getElementById('stockFilter');
                if (stockSelect) {
                    if (type === 'low') stockSelect.value = 'low';
                    else if (type === 'out') stockSelect.value = 'out';
                    else stockSelect.value = 'all';
                    renderProducts();
                }
            };

            window.openStockModal = function(id, name, currentStock) {
                currentStockProductId = id;
                const nameEl = document.getElementById('stockProductName');
                if (nameEl) nameEl.textContent = name;
                const valEl = document.getElementById('newStockValue');
                if (valEl) valEl.value = currentStock;
                const modal = document.getElementById('stockModal');
                if (modal) modal.classList.add('active');
            };

            window.updateStock = async function() {
                const newStock = parseInt(document.getElementById('newStockValue')?.value) || 0;
                try {
                    await supabaseRequest(`/rest/v1/products?id=eq.${currentStockProductId}`, {
                        method: 'PATCH',
                        body: { stock_quantity: newStock, stock: newStock, updated_at: new Date().toISOString() }
                    });
                    showToast('✅ تم تحديث الكمية بنجاح', 'success');
                    closeStockModal();
                    await loadProducts();
                } catch(e) { showToast('❌ خطأ في التحديث: ' + e.message, 'error'); }
            };

            window.deleteProduct = async function(id) {
                if (!confirm('⚠️ هل أنت متأكد من حذف هذا المنتج نهائياً؟')) return;
                try {
                    await supabaseRequest(`/rest/v1/products?id=eq.${id}`, { method: 'DELETE' });
                    showToast('🗑 تم حذف المنتج بنجاح', 'success');
                    await loadProducts();
                } catch(e) { showToast('❌ خطأ في الحذف: ' + e.message, 'error'); }
            };

            window.closeStockModal = function() {
                const modal = document.getElementById('stockModal');
                if (modal) modal.classList.remove('active');
                currentStockProductId = null;
            };
            
            window.loadProducts = loadProducts;
            
            loadProducts();
        })();
    </script>
</body>
</html>
