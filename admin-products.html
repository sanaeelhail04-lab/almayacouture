<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إدارة المنتجات | Almaya Couture</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0F0B08;
      --bg-secondary: #1A1510;
      --bg-card: #231D15;
      --gold: #C4A06A;
      --gold-light: #D4B896;
      --text-primary: #F5EDD8;
      --text-secondary: #A89880;
      --text-muted: #6B5F52;
      --border: rgba(196, 160, 106, 0.15);
      --success: #25D366;
      --danger: #FF4757;
      --warning: #FFA502;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s ease;
    }

    body {
      background: var(--bg-primary);
      font-family: 'Tajawal', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* حاوية رئيسية متجاوبة */
    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* رأس الصفحة */
    .page-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }

    .page-header h1 {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* شبكة الإحصائيات - متجاوبة */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }

    .stat-icon {
      width: 45px;
      height: 45px;
      background: rgba(196, 160, 106, 0.1);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--gold);
    }

    .stat-info {
      flex: 1;
    }

    .stat-value {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* شريط الإجراءات - متجاوب */
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: 0.9rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.7rem 2rem 0.7rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* أزرار متجاوبة */
    .btn-group-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--gold), #A07840);
      color: #1A1510;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
    }

    .btn-outline:hover {
      background: rgba(196, 160, 106, 0.1);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #e84118);
      color: white;
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
    }

    /* حاوية الجدول - تمرير أفقي للشاشات الصغيرة */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--bg-card);
      -webkit-overflow-scrolling: touch;
    }

    /* تصميم الجدول المتجاوب */
    .products-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    .products-table th {
      background: var(--bg-secondary);
      color: var(--gold);
      padding: 1rem 0.8rem;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .products-table td {
      padding: 0.8rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .products-table tr:hover {
      background: rgba(196, 160, 106, 0.02);
    }

    /* صورة المنتج */
    .product-thumb {
      width: 45px;
      height: 56px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      display: block;
    }

    /* اسم المنتج */
    .product-name {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .product-featured {
      font-size: 0.7rem;
      color: var(--gold);
      margin-top: 4px;
    }

    /* حالة المنتج */
    .status-badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      display: inline-block;
      white-space: nowrap;
    }

    .status-active {
      background: rgba(37, 211, 102, 0.1);
      color: var(--success);
    }

    .status-hidden {
      background: rgba(255, 71, 87, 0.1);
      color: var(--danger);
    }

    /* أزرار الإجراءات */
    .action-buttons {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 0.35rem 0.6rem;
      font-size: 0.7rem;
      cursor: pointer;
      border-radius: var(--radius-sm);
      border: none;
      transition: var(--transition);
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .action-btn:hover {
      transform: scale(1.05);
    }

    .action-btn.edit:hover {
      background: var(--gold);
      color: #1A1510;
    }

    .action-btn.duplicate:hover {
      background: var(--warning);
      color: #1A1510;
    }

    .action-btn.delete:hover {
      background: var(--danger);
      color: white;
    }

    .action-btn.toggle:hover {
      background: var(--success);
      color: #1A1510;
    }

    /* رسالة فارغة */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* مودال الحذف */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    /* إشعار التراجع */
    .undo-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      font-size: 0.85rem;
      white-space: nowrap;
      flex-wrap: wrap;
      justify-content: center;
    }

    .undo-toast.show {
      opacity: 1;
      pointer-events: all;
    }

    /* ========== تحسينات للشاشات الصغيرة ========== */
    @media (max-width: 768px) {
      .admin-container {
        padding: 0.8rem;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.8rem;
      }

      .stat-card {
        padding: 0.8rem;
      }

      .stat-icon {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }

      .actions-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }

      .btn-group-actions {
        justify-content: center;
      }

      .btn {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }

      .products-table th,
      .products-table td {
        padding: 0.6rem;
      }

      .product-thumb {
        width: 38px;
        height: 48px;
      }

      .action-buttons {
        flex-direction: column;
        gap: 0.3rem;
      }

      .action-btn {
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .admin-container {
        padding: 0.6rem;
      }

      .page-header h1 {
        font-size: 1.2rem;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
      }

      .stat-card {
        padding: 0.6rem;
      }

      .stat-value {
        font-size: 1.1rem;
      }

      .stat-label {
        font-size: 0.6rem;
      }

      .products-table th {
        font-size: 0.7rem;
        padding: 0.5rem;
      }

      .products-table td {
        font-size: 0.75rem;
        padding: 0.5rem;
      }

      .product-name {
        font-size: 0.75rem;
      }

      .action-btn {
        padding: 0.25rem 0.5rem;
        font-size: 0.65rem;
      }

      .undo-toast {
        font-size: 0.7rem;
        padding: 0.4rem 0.8rem;
        bottom: 10px;
        white-space: normal;
        width: 90%;
        justify-content: center;
      }
    }

    /* تحسينات للشاشات المتوسطة (تابلت) */
    @media (min-width: 769px) and (max-width: 1024px) {
      .admin-container {
        padding: 1.2rem;
      }

      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .products-table {
        min-width: 700px;
      }
    }

    /* تحسينات للشاشات الكبيرة */
    @media (min-width: 1400px) {
      .admin-container {
        padding: 2rem;
      }

      .stats-grid {
        gap: 1.5rem;
      }
    }

    /* دعم الوضع المظلم/الفاتح */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #F5F0E8;
        --bg-secondary: #FDFCF8;
        --bg-card: #FFFFFF;
        --gold: #A07840;
        --text-primary: #2A2218;
        --text-secondary: #6B5F52;
        --text-muted: #8B7B68;
        --border: rgba(160, 120, 64, 0.15);
      }
    }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="page-header">
    <h1><i class="fas fa-boxes"></i> إدارة المنتجات</h1>
  </div>

  <!-- إحصائيات متجاوبة -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-boxes"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="totalProducts">0</div>
        <div class="stat-label">إجمالي المنتجات</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-eye"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="activeProducts">0</div>
        <div class="stat-label">منتجات نشطة</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-star"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="featuredProducts">0</div>
        <div class="stat-label">منتجات مميزة</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-image"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="totalImages">0</div>
        <div class="stat-label">إجمالي الصور</div>
      </div>
    </div>
  </div>

  <!-- شريط الإجراءات المتجاوب -->
  <div class="actions-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="بحث عن منتج...">
    </div>
    <div class="btn-group-actions">
      <button class="btn btn-outline" onclick="exportProducts()">
        <i class="fas fa-download"></i> <span>تصدير</span>
      </button>
      <label class="btn btn-outline">
        <i class="fas fa-upload"></i> <span>استيراد</span>
        <input type="file" accept=".json" onchange="importProducts(this.files[0])" style="display: none">
      </label>
    </div>
  </div>

  <!-- جدول المنتجات المتجاوب -->
  <div class="table-wrapper">
    <table class="products-table">
      <thead>
        <tr>
          <th>الصورة</th>
          <th>المنتج</th>
          <th>الفئة</th>
          <th>السعر</th>
          <th>الحالة</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="productsTableBody">
        <tr><td colspan="6"><div class="loader"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- مودال حذف -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: var(--danger);"></i>
    <h3 style="margin: 1rem 0; font-size: 1.2rem;">حذف المنتج</h3>
    <p id="deleteProductName" style="color: var(--gold); margin-bottom: 1rem;"></p>
    <div style="display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap;">
      <button class="btn btn-danger" onclick="confirmDelete()">نعم، احذف</button>
      <button class="btn btn-outline" onclick="closeDeleteModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- إشعار التراجع -->
<div class="undo-toast" id="undoToast">
  <i class="fas fa-undo-alt" style="color: var(--gold);"></i>
  <span id="undoMessage">تم حذف المنتج</span>
  <button class="btn btn-outline" onclick="undoDelete()" style="padding: 0.3rem 0.8rem; font-size: 0.7rem;">تراجع</button>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
<script>
  let allProducts = [];
  let pendingDeletions = [];
  let undoTimeout = null;
  let deleteId = null;

  async function supabaseRequest(endpoint, options = {}) {
    const url = `${window.CONFIG.SUPABASE_URL}${endpoint}`;
    const headers = {
      'apikey': window.CONFIG.SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${window.CONFIG.SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };

    const config = {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    };

    const response = await fetch(url, config);
    if (response.status === 204) return null;
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || `خطأ ${response.status}`);
    return data;
  }

  async function loadProducts() {
    try {
      allProducts = await supabaseRequest('/rest/v1/products?select=*&order=display_order') || [];
      updateStats();
      renderProductsTable();
    } catch (error) {
      document.getElementById('productsTableBody').innerHTML = '<tr><td colspan="6"><div class="empty-state">❌ فشل تحميل المنتجات</div></td></tr>';
    }
  }

  function updateStats() {
    const active = allProducts.filter(p => p.is_active === true).length;
    const featured = allProducts.filter(p => p.is_featured === true).length;
    let totalImages = 0;
    allProducts.forEach(p => {
      totalImages++;
      if (p.additional_images) totalImages += p.additional_images.length;
    });
    
    document.getElementById('totalProducts').textContent = allProducts.length;
    document.getElementById('activeProducts').textContent = active;
    document.getElementById('featuredProducts').textContent = featured;
    document.getElementById('totalImages').textContent = totalImages;
  }

  function renderProductsTable() {
    const tbody = document.getElementById('productsTableBody');
    const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
    
    let filtered = allProducts;
    if (searchTerm) {
      filtered = allProducts.filter(p => 
        p.product_name?.toLowerCase().includes(searchTerm) ||
        p.category_name?.toLowerCase().includes(searchTerm)
      );
    }
    
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">📦 لا توجد منتجات</div></td></tr>';
      return;
    }
    
    tbody.innerHTML = filtered.map(product => `
      <tr>
        <td><img src="${product.product_image_url || 'https://placehold.co/50x63'}" class="product-thumb" onerror="this.src='https://placehold.co/50x63'" alt=""></td>
        <td>
          <div class="product-name">${escapeHtml(product.product_name)}</div>
          ${product.is_featured ? '<div class="product-featured">⭐ مميز</div>' : ''}
        </td>
        <td>${escapeHtml(product.category_name)}</td>
        <td style="color: var(--gold);">${escapeHtml(product.price_range || '—')}</td>
        <td><span class="status-badge ${product.is_active ? 'status-active' : 'status-hidden'}">${product.is_active ? 'نشط' : 'مخفي'}</span></td>
        <td>
          <div class="action-buttons">
            <button class="action-btn toggle" onclick="toggleStatus(${product.id})" title="${product.is_active ? 'إخفاء' : 'إظهار'}">
              <i class="fas fa-${product.is_active ? 'eye-slash' : 'eye'}"></i>
            </button>
            <button class="action-btn edit" onclick="editProduct(${product.id})" title="تعديل">
              <i class="fas fa-edit"></i>
            </button>
            <button class="action-btn duplicate" onclick="duplicateProduct(${product.id})" title="نسخ">
              <i class="fas fa-copy"></i>
            </button>
            <button class="action-btn delete" onclick="openDeleteModal(${product.id}, '${escapeHtml(product.product_name)}')" title="حذف">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function toggleStatus(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    try {
      await supabaseRequest(`/rest/v1/products?id=eq.${id}`, {
        method: 'PATCH',
        body: { is_active: !product.is_active }
      });
      await loadProducts();
    } catch (error) {
      console.error('خطأ في تغيير الحالة', error);
    }
  }

  function editProduct(id) {
    window.location.href = `admin-add-product.html?edit=${id}`;
  }

  async function duplicateProduct(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    const { id: _, created_at, updated_at, ...productData } = product;
    productData.product_name = `${product.product_name} (نسخة)`;
    productData.display_order = (product.display_order || 0) + 1;
    
    try {
      await supabaseRequest('/rest/v1/products', {
        method: 'POST',
        body: productData
      });
      await loadProducts();
    } catch (error) {
      console.error('خطأ في نسخ المنتج', error);
    }
  }

  function openDeleteModal(id, name) {
    deleteId = id;
    document.getElementById('deleteProductName').textContent = name;
    document.getElementById('deleteModal').classList.add('active');
  }
  
  function closeDeleteModal() {
    deleteId = null;
    document.getElementById('deleteModal').classList.remove('active');
  }
  
  async function confirmDelete() {
    if (!deleteId) return;
    
    closeDeleteModal();
    
    try {
      const product = allProducts.find(p => p.id === deleteId);
      await supabaseRequest(`/rest/v1/products?id=eq.${deleteId}`, { method: 'DELETE' });
      
      pendingDeletions.push({ id: deleteId, product: product });
      showUndoMessage(product.product_name);
      await loadProducts();
    } catch (error) {
      console.error('خطأ في الحذف', error);
    }
    
    deleteId = null;
  }
  
  function showUndoMessage(productName) {
    const toast = document.getElementById('undoToast');
    document.getElementById('undoMessage').innerHTML = `تم حذف "${productName.substring(0, 30)}"`;
    toast.classList.add('show');
    
    if (undoTimeout) clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => {
      toast.classList.remove('show');
      pendingDeletions = [];
    }, 5000);
  }
  
  async function undoDelete() {
    const toast = document.getElementById('undoToast');
    toast.classList.remove('show');
    
    if (pendingDeletions.length > 0) {
      const lastDeleted = pendingDeletions.pop();
      if (lastDeleted && lastDeleted.product) {
        const { id: _, created_at, updated_at, ...productData } = lastDeleted.product;
        
        try {
          await supabaseRequest('/rest/v1/products', { method: 'POST', body: productData });
          await loadProducts();
        } catch (error) {
          console.error('خطأ في استعادة المنتج', error);
        }
      }
    }
    
    if (undoTimeout) clearTimeout(undoTimeout);
  }
  
  function exportProducts() {
    const dataStr = JSON.stringify(allProducts, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `products_${new Date().toISOString().slice(0, 19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  
  async function importProducts(file) {
    if (!file) return;
    
    try {
      const text = await file.text();
      const products = JSON.parse(text);
      let imported = 0;
      
      for (const product of products) {
        if (product.product_name) {
          const { id, created_at, updated_at, ...cleanProduct } = product;
          await supabaseRequest('/rest/v1/products', { method: 'POST', body: cleanProduct });
          imported++;
        }
      }
      
      await loadProducts();
      alert(`✅ تم استيراد ${imported} منتج`);
    } catch (error) {
      alert('❌ فشل الاستيراد');
    }
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function filterProducts() {
    renderProductsTable();
  }
  
  document.getElementById('searchInput')?.addEventListener('input', filterProducts);
  
  if (typeof window.CONFIG !== 'undefined') {
    loadProducts();
  } else {
    document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">❌ ملف config.js مفقود</div>';
  }
  
  window.toggleStatus = toggleStatus;
  window.editProduct = editProduct;
  window.duplicateProduct = duplicateProduct;
  window.openDeleteModal = openDeleteModal;
  window.closeDeleteModal = closeDeleteModal;
  window.confirmDelete = confirmDelete;
  window.undoDelete = undoDelete;
  window.exportProducts = exportProducts;
  window.importProducts = importProducts;
</script>
</body>
</html>
