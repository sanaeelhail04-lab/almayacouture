<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات | Almaya Couture</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0F0B08;
      --bg-secondary: #1A1510;
      --bg-card: #231D15;
      --gold: #C4A06A;
      --gold-light: #D4B896;
      --text-primary: #F5EDD8;
      --text-secondary: #A89880;
      --text-muted: #6B5F52;
      --border: rgba(196, 160, 106, 0.15);
      --success: #25D366;
      --danger: #FF4757;
      --radius: 16px;
      --radius-lg: 20px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg-primary);
      font-family: 'Tajawal', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .admin-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 1rem;
    }

    .nav-link {
      padding: 0.5rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .nav-link:hover, .nav-link.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      background: rgba(196, 160, 106, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--gold);
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .actions-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 2rem 0.6rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
    }

    .search-box i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
    }

    .btn {
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--gold), #A07840);
      color: #1A1510;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #e84118);
      color: white;
    }

    .btn-sm {
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--bg-secondary);
      color: var(--gold);
      padding: 1rem;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 700;
    }

    td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    tr:hover {
      background: rgba(196, 160, 106, 0.02);
    }

    .product-thumb {
      width: 50px;
      height: 63px;
      object-fit: cover;
      border-radius: 8px;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.7rem;
      display: inline-block;
    }

    .status-active {
      background: rgba(37, 211, 102, 0.1);
      color: var(--success);
    }

    .status-hidden {
      background: rgba(255, 71, 87, 0.1);
      color: var(--danger);
    }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .action-buttons button {
      padding: 0.3rem 0.6rem;
      font-size: 0.7rem;
      cursor: pointer;
      border-radius: 6px;
      border: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .undo-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .undo-toast.show {
      opacity: 1;
      pointer-events: all;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .admin-container {
        padding: 1rem;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

<!-- Header -->
<div id="header-placeholder"></div>

<div class="admin-container">
  <div class="header">
    <h1><i class="fas fa-boxes"></i> إدارة المنتجات</h1>
    <div class="nav-links">
      <a href="admin-add-product.html" class="nav-link"><i class="fas fa-plus-circle"></i> إضافة منتج</a>
    </div>
  </div>

  <!-- إحصائيات -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-boxes"></i></div>
      <div>
        <div class="stat-value" id="totalProducts">0</div>
        <div class="stat-label">إجمالي المنتجات</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-eye"></i></div>
      <div>
        <div class="stat-value" id="activeProducts">0</div>
        <div class="stat-label">منتجات نشطة</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-star"></i></div>
      <div>
        <div class="stat-value" id="featuredProducts">0</div>
        <div class="stat-label">منتجات مميزة</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-image"></i></div>
      <div>
        <div class="stat-value" id="totalImages">0</div>
        <div class="stat-label">إجمالي الصور</div>
      </div>
    </div>
  </div>

  <!-- شريط الإجراءات -->
  <div class="actions-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="بحث عن منتج...">
    </div>
    <button class="btn btn-outline" onclick="exportProducts()">
      <i class="fas fa-download"></i> تصدير JSON
    </button>
    <label class="btn btn-outline">
      <i class="fas fa-upload"></i> استيراد JSON
      <input type="file" accept=".json" onchange="importProducts(this.files[0])" style="display: none">
    </label>
  </div>

  <!-- جدول المنتجات -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr><th>الصورة</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>الحالة</th><th>الإجراءات</th></tr>
      </thead>
      <tbody id="productsTableBody">
        <tr><td colspan="6"><div class="loader"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>

<script src="header.js"></script>
<script src="footer.js"></script>
<script src="config.js"></script>
<script>
  let allProducts = [];
  let pendingDeletions = [];
  let undoTimeout = null;
  let deleteId = null;

  function showMessage(text, type = 'info') {
    console.log(text);
  }

  async function supabaseRequest(endpoint, options = {}) {
    const url = `${window.CONFIG.SUPABASE_URL}${endpoint}`;
    const headers = {
      'apikey': window.CONFIG.SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${window.CONFIG.SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };

    const config = {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    };

    const response = await fetch(url, config);
    if (response.status === 204) return null;
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || `خطأ ${response.status}`);
    return data;
  }

  async function loadProducts() {
    try {
      allProducts = await supabaseRequest('/rest/v1/products?select=*&order=display_order') || [];
      updateStats();
      renderProductsTable();
    } catch (error) {
      document.getElementById('productsTableBody').innerHTML = '<tr><td colspan="6">❌ فشل تحميل المنتجات</td></tr>';
    }
  }

  function updateStats() {
    const active = allProducts.filter(p => p.is_active === true).length;
    const featured = allProducts.filter(p => p.is_featured === true).length;
    let totalImages = 0;
    allProducts.forEach(p => {
      totalImages++;
      if (p.additional_images) totalImages += p.additional_images.length;
    });
    
    document.getElementById('totalProducts').textContent = allProducts.length;
    document.getElementById('activeProducts').textContent = active;
    document.getElementById('featuredProducts').textContent = featured;
    document.getElementById('totalImages').textContent = totalImages;
  }

  function renderProductsTable() {
    const tbody = document.getElementById('productsTableBody');
    const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
    
    let filtered = allProducts;
    if (searchTerm) {
      filtered = allProducts.filter(p => 
        p.product_name?.toLowerCase().includes(searchTerm) ||
        p.category_name?.toLowerCase().includes(searchTerm)
      );
    }
    
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div style="text-align: center; padding: 2rem;">لا توجد منتجات</div></td></tr>';
      return;
    }
    
    tbody.innerHTML = filtered.map(product => `
      <tr>
        <td><img src="${product.product_image_url || 'https://placehold.co/50x63'}" class="product-thumb" onerror="this.src='https://placehold.co/50x63'" alt=""></td>
        <td><strong style="color: var(--text-primary);">${escapeHtml(product.product_name)}</strong><br><small>${product.is_featured ? '⭐ مميز' : ''}</small></td>
        <td>${escapeHtml(product.category_name)}</td>
        <td style="color: var(--gold);">${escapeHtml(product.price_range || '—')}</td>
        <td><span class="status-badge ${product.is_active ? 'status-active' : 'status-hidden'}">${product.is_active ? 'نشط' : 'مخفي'}</span></td>
        <td class="action-buttons">
          <button class="btn-outline btn-sm" onclick="toggleStatus(${product.id})" title="${product.is_active ? 'إخفاء' : 'إظهار'}">
            <i class="fas fa-${product.is_active ? 'eye-slash' : 'eye'}"></i>
          </button>
          <button class="btn-outline btn-sm" onclick="editProduct(${product.id})" title="تعديل">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn-outline btn-sm" onclick="duplicateProduct(${product.id})" title="نسخ">
            <i class="fas fa-copy"></i>
          </button>
          <button class="btn-danger btn-sm" onclick="openDeleteModal(${product.id}, '${escapeHtml(product.product_name)}')" title="حذف">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    `).join('');
  }

  async function toggleStatus(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    try {
      await supabaseRequest(`/rest/v1/products?id=eq.${id}`, {
        method: 'PATCH',
        body: { is_active: !product.is_active }
      });
      await loadProducts();
    } catch (error) {
      console.error('خطأ في تغيير الحالة', error);
    }
  }

  function editProduct(id) {
    window.location.href = `admin-add-product.html?edit=${id}`;
  }

  async function duplicateProduct(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    const { id: _, created_at, updated_at, ...productData } = product;
    productData.product_name = `${product.product_name} (نسخة)`;
    productData.display_order = (product.display_order || 0) + 1;
    
    try {
      await supabaseRequest('/rest/v1/products', {
        method: 'POST',
        body: productData
      });
      await loadProducts();
    } catch (error) {
      console.error('خطأ في نسخ المنتج', error);
    }
  }

  function openDeleteModal(id, name) {
    deleteId = id;
    document.getElementById('deleteProductName').textContent = name;
    document.getElementById('deleteModal').classList.add('active');
  }
  
  function closeDeleteModal() {
    deleteId = null;
    document.getElementById('deleteModal').classList.remove('active');
  }
  
  async function confirmDelete() {
    if (!deleteId) return;
    
    closeDeleteModal();
    
    try {
      const product = allProducts.find(p => p.id === deleteId);
      await supabaseRequest(`/rest/v1/products?id=eq.${deleteId}`, { method: 'DELETE' });
      
      pendingDeletions.push({ id: deleteId, product: product });
      showUndoMessage(product.product_name);
      await loadProducts();
    } catch (error) {
      console.error('خطأ في الحذف', error);
    }
    
    deleteId = null;
  }
  
  function showUndoMessage(productName) {
    const toast = document.getElementById('undoToast');
    document.getElementById('undoMessage').innerHTML = `تم حذف "${productName.substring(0, 30)}"`;
    toast.classList.add('show');
    
    if (undoTimeout) clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => {
      toast.classList.remove('show');
      pendingDeletions = [];
    }, 5000);
  }
  
  async function undoDelete() {
    const toast = document.getElementById('undoToast');
    toast.classList.remove('show');
    
    if (pendingDeletions.length > 0) {
      const lastDeleted = pendingDeletions.pop();
      if (lastDeleted && lastDeleted.product) {
        const { id: _, created_at, updated_at, ...productData } = lastDeleted.product;
        
        try {
          await supabaseRequest('/rest/v1/products', { method: 'POST', body: productData });
          await loadProducts();
        } catch (error) {
          console.error('خطأ في استعادة المنتج', error);
        }
      }
    }
    
    if (undoTimeout) clearTimeout(undoTimeout);
  }
  
  function exportProducts() {
    const dataStr = JSON.stringify(allProducts, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `products_${new Date().toISOString().slice(0, 19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  
  async function importProducts(file) {
    if (!file) return;
    
    try {
      const text = await file.text();
      const products = JSON.parse(text);
      let imported = 0;
      
      for (const product of products) {
        if (product.product_name) {
          const { id, created_at, updated_at, ...cleanProduct } = product;
          await supabaseRequest('/rest/v1/products', { method: 'POST', body: cleanProduct });
          imported++;
        }
      }
      
      await loadProducts();
      alert(`✅ تم استيراد ${imported} منتج`);
    } catch (error) {
      alert('❌ فشل الاستيراد');
    }
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function filterProducts() {
    renderProductsTable();
  }
  
  document.getElementById('searchInput')?.addEventListener('input', filterProducts);
  
  if (typeof window.CONFIG !== 'undefined') {
    loadProducts();
  } else {
    document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">❌ ملف config.js مفقود</div>';
  }
  
  window.toggleStatus = toggleStatus;
  window.editProduct = editProduct;
  window.duplicateProduct = duplicateProduct;
  window.openDeleteModal = openDeleteModal;
  window.closeDeleteModal = closeDeleteModal;
  window.confirmDelete = confirmDelete;
  window.undoDelete = undoDelete;
  window.exportProducts = exportProducts;
  window.importProducts = importProducts;
</script>

<!-- مودال حذف -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--danger);"></i>
    <h3 style="margin: 1rem 0;">حذف المنتج</h3>
    <p id="deleteProductName" style="color: var(--gold); margin-bottom: 1rem;"></p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <button class="btn btn-danger" onclick="confirmDelete()">نعم، احذف</button>
      <button class="btn btn-outline" onclick="closeDeleteModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- إشعار التراجع -->
<div class="undo-toast" id="undoToast">
  <i class="fas fa-undo-alt" style="color: var(--gold);"></i>
  <span id="undoMessage">تم حذف المنتج</span>
  <button class="btn btn-outline btn-sm" onclick="undoDelete()">تراجع</button>
</div>
</body>
</html>
