<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المسؤولين | Almaya Couture</title>
    <link rel="icon" href="images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="admin.js"></script>
    
    <style>
        :root {
            --gold: #C4A06A;
            --gold-light: #D4B896;
            --bg: #1A1510;
            --bg2: #0F0C09;
            --card: #2A2218;
            --text: #F5EDD8;
            --text-secondary: #A89880;
            --border: rgba(196,160,106,0.15);
            --border-hover: rgba(196,160,106,0.3);
            --success: #25D366;
            --danger: #FF4757;
            --warning: #FFA502;
            --info: #3B82F6;
        }
        
        body.white-theme {
            --gold: #A07840;
            --bg: #FDFCF8;
            --bg2: #F5F0E8;
            --card: #FFFFFF;
            --text: #2A2218;
            --text-secondary: #6B5F52;
            --border: rgba(160,120,64,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-header .badge {
            display: inline-block;
            background: rgba(196,160,106,0.15);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
        }
        .stat-box i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .stat-box .number {
            font-size: 1.8rem;
            font-weight: 800;
        }
        .stat-box .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #1A1510;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(196,160,106,0.3);
        }
        .btn-edit {
            background: rgba(59,130,246,0.15);
            color: var(--info);
            border: 1px solid rgba(59,130,246,0.3);
        }
        .btn-edit:hover {
            background: rgba(59,130,246,0.25);
        }
        .btn-delete {
            background: rgba(255,71,87,0.15);
            color: var(--danger);
            border: 1px solid rgba(255,71,87,0.3);
        }
        .btn-delete:hover {
            background: rgba(255,71,87,0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }
        th {
            text-align: right;
            padding: 1rem;
            background: var(--bg2);
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        tr:hover td {
            background: rgba(196,160,106,0.03);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .status-active {
            background: rgba(37,211,102,0.15);
            color: var(--success);
        }
        .status-inactive {
            background: rgba(255,71,87,0.15);
            color: var(--danger);
        }
        .role-badge {
            background: rgba(196,160,106,0.15);
            color: var(--gold);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            color: var(--gold);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold);
        }
        .form-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.85rem;
            z-index: 1001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .message.success { border-right: 3px solid var(--success); color: var(--success); }
        .message.error { border-right: 3px solid var(--danger); color: var(--danger); }
        .message.info { border-right: 3px solid var(--info); color: var(--info); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }


        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .container { padding: 1rem; }
               }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="page-header">
            <div class="badge"><i class="fas fa-user-shield"></i> إدارة المسؤولين</div>
            <h1>المسؤولين</h1>
            <p>إضافة، تعديل، حذف المسؤولين في النظام</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <i class="fas fa-users"></i>
                <div class="number" id="totalAdmins">0</div>
                <div class="label">إجمالي المسؤولين</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-check-circle"></i>
                <div class="number" id="activeAdmins">0</div>
                <div class="label">نشط</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-clock"></i>
                <div class="number" id="inactiveAdmins">0</div>
                <div class="label">معطل</div>
            </div>
        </div>

        <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="openAddModal()">
                <i class="fas fa-plus-circle"></i> إضافة مسؤول جديد
            </button>
            <button class="btn btn-outline" onclick="loadAdmins()">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم المستخدم</th>
                        <th>البريد الإلكتروني</th>
                        <th>الاسم الكامل</th>
                        <th>الدور</th>
                        <th>الحالة</th>
                        <th>آخر تسجيل دخول</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminsTableBody">
                    <tr><td colspan="8"><div style="text-align:center;padding:2rem;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal إضافة/تعديل -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-user-plus"></i> إضافة مسؤول جديد</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="adminForm">
                <input type="hidden" id="adminId" value="">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> اسم المستخدم *</label>
                    <input type="text" id="username" placeholder="almaya_admin" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> البريد الإلكتروني *</label>
                    <input type="email" id="email" placeholder="admin@almaya.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-circle"></i> الاسم الكامل</label>
                    <input type="text" id="fullName" placeholder="مدير النظام">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> كلمة المرور <span id="passwordReq" style="font-size:0.7rem; color:var(--warning);">(مطلوب للإضافة)</span></label>
                    <input type="password" id="password" placeholder="********">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> الدور</label>
                    <select id="role">
                        <option value="admin">مسؤول عادي</option>
                        <option value="super_admin">مدير عام</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-toggle-on"></i> الحالة</label>
                    <select id="isActive">
                        <option value="true">نشط</option>
                        <option value="false">معطل</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal حذف -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h3><i class="fas fa-trash-alt" style="color: var(--danger);"></i> تأكيد الحذف</h3>
                <button class="modal-close" onclick="closeDeleteModal()"><i class="fas fa-times"></i></button>
            </div>
            <p style="margin-bottom: 1rem;">هل أنت متأكد من حذف هذا المسؤول؟</p>
            <p style="color: var(--gold); margin-bottom: 1rem; font-weight: bold;" id="deleteAdminName"></p>
            <div class="form-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">إلغاء</button>
                <button class="btn btn-delete" id="confirmDeleteBtn">نعم، احذف</button>
            </div>
        </div>
    </div>

    <div class="message" id="message"></div>

   

    <script src="header.js"></script>
    <script src="footer.js"></script>
    
    <script>
       
        // التحقق من CONFIG
        if (typeof CONFIG === 'undefined') {
            document.body.innerHTML = '<div style="color:#FF4757;text-align:center;padding:2rem;">❌ CONFIG.js مفقود</div>';
            throw new Error('CONFIG missing');
        }

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }

        // دالة تشفير كلمة المرور (SHA-256)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // دالة الاتصال بـ Supabase
        async function supabaseRequest(endpoint, opts = {}) {
            try {
                const res = await fetch(`${SUPABASE_URL}${endpoint}`, {
                    method: opts.method || 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: opts.body ? JSON.stringify(opts.body) : undefined
                });
                
                if (res.status === 204) return null;
                if (res.status === 404) return [];
                
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.message || `خطأ ${res.status}`);
                }
                return data;
            } catch(e) {
                console.error('Supabase error:', e);
                throw e;
            }
        }

        // تحميل قائمة المسؤولين
        async function loadAdmins() {
            const tbody = document.getElementById('adminsTableBody');
            tbody.innerHTML = '<tr><td colspan="8"><div style="text-align:center;padding:2rem;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div></td></tr>';
            
            try {
                const admins = await supabaseRequest('/rest/v1/admins?select=*&order=id.desc');
                
                if (!admins || admins.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8"><div style="text-align:center;padding:2rem;">لا توجد بيانات</div></td></tr>';
                    return;
                }
                
                // تحديث الإحصائيات
                const total = admins.length;
                const active = admins.filter(a => a.is_active === true).length;
                const inactive = total - active;
                document.getElementById('totalAdmins').textContent = total;
                document.getElementById('activeAdmins').textContent = active;
                document.getElementById('inactiveAdmins').textContent = inactive;
                
                tbody.innerHTML = admins.map((admin, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${escapeHtml(admin.username)}</strong></td>
                        <td>${escapeHtml(admin.email)}</td>
                        <td>${escapeHtml(admin.full_name || '-')}</td>
                        <td><span class="role-badge">${admin.role === 'super_admin' ? 'مدير عام' : 'مسؤول'}</span></td>
                        <td><span class="status-badge ${admin.is_active ? 'status-active' : 'status-inactive'}">
                            <i class="fas ${admin.is_active ? 'fa-check-circle' : 'fa-ban'}"></i> ${admin.is_active ? 'نشط' : 'معطل'}
                        </span></td>
                        <td>${admin.last_login ? new Date(admin.last_login).toLocaleDateString('ar-MA') : '-'}</td>
                        <td>
                            <button class="btn btn-edit" onclick='editAdmin(${admin.id}, "${escapeHtml(admin.username)}", "${escapeHtml(admin.email)}", "${escapeHtml(admin.full_name || '')}", "${admin.role}", ${admin.is_active})' style="padding:0.4rem 0.8rem; margin-left:0.4rem;">
                                <i class="fas fa-edit"></i> تعديل
                            </button>
                            <button class="btn btn-delete" onclick="openDeleteModal(${admin.id}, '${escapeHtml(admin.username)}')" style="padding:0.4rem 0.8rem;">
                                <i class="fas fa-trash-alt"></i> حذف
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="8"><div style="text-align:center;padding:2rem;color:var(--danger);">خطأ في التحميل: ' + e.message + '</div></td></tr>';
                showMessage('خطأ في تحميل البيانات: ' + e.message, 'error');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== إضافة مسؤول ==========
        window.openAddModal = function() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i> إضافة مسؤول جديد';
            document.getElementById('adminForm').reset();
            document.getElementById('adminId').value = '';
            document.getElementById('password').value = '';
            document.getElementById('password').placeholder = '********';
            document.getElementById('passwordReq').style.display = 'inline';
            document.getElementById('adminModal').classList.add('active');
        };

        // ========== تعديل مسؤول ==========
        window.editAdmin = function(id, username, email, fullName, role, isActive) {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-edit"></i> تعديل مسؤول';
            document.getElementById('adminId').value = id;
            document.getElementById('username').value = username;
            document.getElementById('email').value = email;
            document.getElementById('fullName').value = fullName;
            document.getElementById('role').value = role;
            document.getElementById('isActive').value = isActive ? 'true' : 'false';
            document.getElementById('password').value = '';
            document.getElementById('password').placeholder = '******** (اتركه فارغاً لعدم التغيير)';
            document.getElementById('passwordReq').style.display = 'none';
            document.getElementById('passwordReq').innerHTML = '(اتركه فارغاً لعدم التغيير)';
            document.getElementById('adminModal').classList.add('active');
        };

        // ========== حفظ (إضافة/تعديل) ==========
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('adminId').value;
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const role = document.getElementById('role').value;
            const isActive = document.getElementById('isActive').value === 'true';
            const password = document.getElementById('password').value;
            
            if (!username || !email) {
                showMessage('يرجى ملء اسم المستخدم والبريد الإلكتروني', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
            submitBtn.disabled = true;
            
            try {
                const data = { 
                    username, 
                    email, 
                    full_name: fullName || null, 
                    role, 
                    is_active: isActive 
                };
                
                if (id) {
                    // تعديل: إذا تم إدخال كلمة مرور جديدة، قم بتشفيرها
                    if (password && password.trim() !== '') {
                        data.password_hash = await hashPassword(password);
                    }
                    await supabaseRequest(`/rest/v1/admins?id=eq.${id}`, { method: 'PATCH', body: data });
                    showMessage('✅ تم تعديل المسؤول بنجاح', 'success');
                } else {
                    // إضافة جديدة: كلمة المرور مطلوبة
                    if (!password || password.trim() === '') {
                        showMessage('⚠️ يرجى إدخال كلمة المرور للمسؤول الجديد', 'error');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        return;
                    }
                    data.password_hash = await hashPassword(password);
                    await supabaseRequest('/rest/v1/admins', { method: 'POST', body: data });
                    showMessage('✅ تم إضافة المسؤول بنجاح', 'success');
                }
                
                closeModal();
                loadAdmins();
            } catch(e) {
                console.error('Save error:', e);
                showMessage('❌ خطأ: ' + e.message, 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // ========== حذف مسؤول ==========
        let deleteId = null;
        
        window.openDeleteModal = function(id, username) {
            deleteId = id;
            document.getElementById('deleteAdminName').textContent = username;
            document.getElementById('deleteModal').classList.add('active');
        };
        
        window.closeDeleteModal = function() {
            deleteId = null;
            document.getElementById('deleteModal').classList.remove('active');
        };
        
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteId) return;
            
            const btn = document.getElementById('confirmDeleteBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحذف...';
            btn.disabled = true;
            
            try {
                await supabaseRequest(`/rest/v1/admins?id=eq.${deleteId}`, { method: 'DELETE' });
                showMessage('✅ تم حذف المسؤول بنجاح', 'success');
                closeDeleteModal();
                loadAdmins();
            } catch(e) {
                showMessage('❌ خطأ في الحذف: ' + e.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // إغلاق المودال
        function closeModal() {
            document.getElementById('adminModal').classList.remove('active');
        }
        window.closeModal = closeModal;

        // إغلاق المودال عند النقر خارجها
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') closeDeleteModal();
        });
        document.getElementById('adminModal').addEventListener('click', (e) => {
            if (e.target.id === 'adminModal') closeModal();
        });

        // تحميل البيانات عند بدء الصفحة
        window.loadAdmins = loadAdmins;
        loadAdmins();
    </script>
    
</body>
</html>
