<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات | Almaya Couture</title>
  <meta name="description" content="لوحة تحكم إدارة منتجات Almaya Couture">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#C4A06A">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0F0B08;
      --bg-secondary: #1A1510;
      --bg-card: #231D15;
      --gold: #C4A06A;
      --gold-light: #D4B896;
      --gold-dark: #A07840;
      --text-primary: #F5EDD8;
      --text-secondary: #A89880;
      --text-muted: #6B5F52;
      --border: rgba(196, 160, 106, 0.15);
      --border-hover: rgba(196, 160, 106, 0.4);
      --success: #25D366;
      --danger: #FF4757;
      --warning: #FFA502;
      --info: #3B82F6;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.white-theme {
      --bg-primary: #F5F0E8;
      --bg-secondary: #FDFCF8;
      --bg-card: #FFFFFF;
      --gold: #A07840;
      --gold-light: #C4A06A;
      --gold-dark: #8B6330;
      --text-primary: #2A2218;
      --text-secondary: #6B5F52;
      --text-muted: #8B7B68;
      --border: rgba(160, 120, 64, 0.15);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    body {
      background: var(--bg-primary);
      font-family: 'Tajawal', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      transition: all 0.3s;
    }

    /* تنسيقات عامة */
    .admin-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* إحصائيات سريعة */
    .quick-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .qs-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: var(--transition);
    }

    .qs-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }

    .qs-icon {
      width: 48px;
      height: 48px;
      background: rgba(196, 160, 106, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--gold);
    }

    .qs-val {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
    }

    .qs-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* تبويبات */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: var(--bg-secondary);
      padding: 0.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 0.8rem 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--radius);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(196, 160, 106, 0.2), rgba(196, 160, 106, 0.05));
      color: var(--gold);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* نموذج الإضافة */
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .full {
      grid-column: 1 / -1;
    }

    .f-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .f-label i {
      color: var(--gold);
    }

    .req {
      color: var(--danger);
    }

    .f-input, .f-textarea, .f-select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .f-input:focus, .f-textarea:focus, .f-select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .f-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* شبكة الصور */
    .imgs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .img-card {
      aspect-ratio: 3/4;
      background: var(--bg-secondary);
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: var(--transition);
    }

    .img-card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
    }

    .img-card.has-img {
      border-style: solid;
      border-color: var(--border-hover);
    }

    .img-card.is-main {
      border-color: var(--gold);
      border-width: 2.5px;
    }

    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.5rem;
      color: var(--text-muted);
    }

    .upload-placeholder i {
      font-size: 2rem;
    }

    .img-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .img-card:hover .img-actions {
      opacity: 1;
    }

    .img-actions button {
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .img-actions button:hover {
      background: var(--gold);
      color: #1A1510;
    }

    .progress-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .progress-bar {
      width: 80%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold);
      width: 0%;
      transition: width 0.2s;
    }

    .progress-text {
      color: white;
      font-size: 0.7rem;
    }

    .cancel-upload {
      background: var(--danger);
      border: none;
      color: white;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.7rem;
    }

    .main-badge {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: var(--gold);
      color: #1A1510;
      font-size: 0.6rem;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      z-index: 5;
    }

    /* فيديو */
    .video-upload-area {
      background: var(--bg-secondary);
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .video-upload-area:hover {
      border-color: var(--gold);
    }

    /* أزرار */
    .btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #1A1510;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(196, 160, 106, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
    }

    .btn-outline:hover {
      background: rgba(196, 160, 106, 0.1);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #e84118);
      color: white;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    /* رسائل */
    .message {
      padding: 1rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      text-align: center;
      display: none;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.success {
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: var(--success);
    }

    .message.error {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: var(--danger);
    }

    .message.info {
      background: rgba(196, 160, 106, 0.1);
      border: 1px solid rgba(196, 160, 106, 0.3);
      color: var(--gold);
    }

    /* جدول المنتجات */
    .tbl-wrap {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .ptable {
      width: 100%;
      border-collapse: collapse;
    }

    .ptable th {
      background: var(--bg-secondary);
      color: var(--gold);
      padding: 1rem;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .ptable td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .ptable tr:hover {
      background: rgba(196, 160, 106, 0.02);
    }

    .p-thumb {
      width: 50px;
      height: 63px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* مودال */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    /* إشعار التراجع */
    .undo-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 1001;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .undo-toast.show {
      opacity: 1;
      pointer-events: all;
    }

    /* تحميل */
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* استجابة */
    @media (max-width: 768px) {
      .admin-container {
        padding: 1rem;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .quick-stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="admin-container">
  
  <!-- إحصائيات سريعة -->
  <div class="quick-stats">
    <div class="qs-card">
      <div class="qs-icon"><i class="fas fa-boxes"></i></div>
      <div>
        <div class="qs-val" id="statTotal">0</div>
        <div class="qs-lbl">إجمالي المنتجات</div>
      </div>
    </div>
    <div class="qs-card">
      <div class="qs-icon"><i class="fas fa-eye"></i></div>
      <div>
        <div class="qs-val" id="statActive">0</div>
        <div class="qs-lbl">منتجات نشطة</div>
      </div>
    </div>
    <div class="qs-card">
      <div class="qs-icon"><i class="fas fa-star"></i></div>
      <div>
        <div class="qs-val" id="statFeatured">0</div>
        <div class="qs-lbl">منتجات مميزة</div>
      </div>
    </div>
    <div class="qs-card">
      <div class="qs-icon"><i class="fas fa-image"></i></div>
      <div>
        <div class="qs-val" id="statImages">0</div>
        <div class="qs-lbl">إجمالي الصور</div>
      </div>
    </div>
  </div>

  <!-- رسالة -->
  <div class="message" id="message"></div>

  <!-- تبويبات -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('add')">
      <i class="fas fa-plus-circle"></i> إضافة منتج
    </button>
    <button class="tab-btn" onclick="switchTab('list')">
      <i class="fas fa-list-ul"></i> قائمة المنتجات
    </button>
  </div>

  <!-- تبويب الإضافة -->
  <div class="tab-content active" id="tab-add">
    <div class="form-card">
      <form id="productForm">
        <div class="form-grid">
          <div class="form-group">
            <label class="f-label"><i class="fas fa-tag"></i> الفئة <span class="req">*</span></label>
            <select class="f-select" id="categoryName" required>
              <option value="">اختر الفئة...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="f-label"><i class="fas fa-tshirt"></i> اسم المنتج <span class="req">*</span></label>
            <input type="text" class="f-input" id="productName" required placeholder="مثال: جلابة مغربية فاخرة">
          </div>
          <div class="form-group">
            <label class="f-label"><i class="fas fa-money-bill-wave"></i> السعر</label>
            <input type="text" class="f-input" id="priceRange" placeholder="مثال: 600-900 درهم">
          </div>
          <div class="form-group">
            <label class="f-label"><i class="fas fa-sort-numeric-down"></i> ترتيب العرض</label>
            <input type="number" class="f-input" id="displayOrder" value="0">
          </div>
          <div class="form-group full">
            <label class="f-label"><i class="fas fa-align-left"></i> وصف المنتج</label>
            <textarea class="f-textarea" id="productDescription" rows="3" maxlength="500" placeholder="وصف جذاب للمنتج..."></textarea>
          </div>
        </div>

        <hr class="sep">

        <!-- صور المنتج -->
        <div class="form-group full">
          <label class="f-label"><i class="fas fa-images"></i> صور المنتج <span class="req">*</span></label>
          <div class="imgs-grid" id="imagesGrid"></div>
          <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('bulkImages').click()" style="margin-top: 1rem; width: 100%;">
            <i class="fas fa-cloud-upload-alt"></i> إضافة صور (حد أقصى 10)
          </button>
          <input type="file" id="bulkImages" accept="image/*" multiple style="display: none" onchange="handleBulkImages(event)">
        </div>

        <hr class="sep">

        <!-- فيديو المنتج -->
        <div class="form-group full">
          <label class="f-label"><i class="fas fa-video"></i> فيديو المنتج (اختياري)</label>
          <div class="video-upload-area" id="videoUploadArea" onclick="document.getElementById('videoInput').click()">
            <i class="fas fa-play-circle" style="font-size: 2.5rem; color: var(--gold); margin-bottom: 0.5rem; display: block;"></i>
            <p style="color: var(--text-muted); font-size: 0.8rem;">اضغط لإضافة فيديو (حد أقصى 50MB)</p>
            <div id="videoPreview"></div>
          </div>
          <input type="file" id="videoInput" accept="video/*" style="display: none" onchange="handleVideo(event)">
        </div>

        <hr class="sep">

        <!-- خيارات إضافية -->
        <div style="display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="isFeatured"> <i class="fas fa-star" style="color: var(--gold);"></i> منتج مميز
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="isActive" checked> <i class="fas fa-eye" style="color: var(--success);"></i> نشط
          </label>
        </div>

        <input type="hidden" id="editId" value="">

        <div class="btn-group">
          <button type="submit" class="btn" id="submitBtn">
            <i class="fas fa-plus-circle"></i> إضافة المنتج
          </button>
          <button type="button" class="btn btn-outline" onclick="resetForm()">
            <i class="fas fa-redo"></i> إعادة تعيين
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- تبويب القائمة -->
  <div class="tab-content" id="tab-list">
    <div class="form-card">
      <div style="margin-bottom: 1rem; display: flex; gap: 1rem; flex-wrap: wrap;">
        <button class="btn btn-outline btn-sm" onclick="exportProducts()">
          <i class="fas fa-download"></i> تصدير JSON
        </button>
        <label class="btn btn-outline btn-sm">
          <i class="fas fa-upload"></i> استيراد JSON
          <input type="file" accept=".json" onchange="importProducts(this.files[0])" style="display: none">
        </label>
        <div style="flex: 1;"></div>
        <div style="position: relative;">
          <i class="fas fa-search" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gold);"></i>
          <input type="text" id="searchInput" placeholder="بحث..." style="padding: 0.6rem 2rem 0.6rem 1rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); width: 200px;">
        </div>
      </div>

      <div class="tbl-wrap">
        <table class="ptable">
          <thead>
            <tr><th>الصورة</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>الحالة</th><th>الإجراءات</th></tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="6"><div class="loader"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- مودال حذف -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--danger);"></i>
    <h3 style="margin: 1rem 0;">حذف المنتج</h3>
    <p id="deleteProductName" style="color: var(--gold); margin-bottom: 1rem;"></p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <button class="btn btn-danger" onclick="confirmDelete()">نعم، احذف</button>
      <button class="btn btn-outline" onclick="closeDeleteModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- إشعار التراجع -->
<div class="undo-toast" id="undoToast">
  <i class="fas fa-undo-alt" style="color: var(--gold);"></i>
  <span id="undoMessage">تم حذف المنتج</span>
  <button class="btn btn-outline btn-sm" onclick="undoDelete()">تراجع</button>
</div>

<script>
  // ==================== التهيئة والإعدادات ====================
  // تأكد من وجود ملف config.js بنفس المجلد يحتوي على:
  // window.CONFIG = {
  //   SUPABASE_URL: "https://xxx.supabase.co",

  // ==================== دوال Cloudinary ====================
  async function uploadToCloudinary(file, type, onProgress) {
    return new Promise((resolve, reject) => {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', type === 'video' ? 'almaya-products/videos' : 'almaya-products/images');

      const xhr = new XMLHttpRequest();
      const abortController = new AbortController();
      const uploadId = Date.now() + Math.random();
      
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY_CLOUD_NAME}/${type}/upload`);
      
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress(Math.round((e.loaded / e.total) * 100));
        }
      };
      
      xhr.onload = () => {
        activeUploads.delete(uploadId);
        if (xhr.status === 200) {
          resolve(JSON.parse(xhr.responseText));
        } else {
          reject(new Error(`فشل الرفع: ${xhr.status}`));
        }
      };
      
      xhr.onerror = () => {
        activeUploads.delete(uploadId);
        reject(new Error('خطأ في الاتصال'));
      };
      
      xhr.ontimeout = () => {
        activeUploads.delete(uploadId);
        reject(new Error('انتهى وقت الرفع'));
      };
      
      xhr.timeout = 120000; // دقيقتين مهلة
      xhr.send(formData);
      activeUploads.set(uploadId, { xhr, abortController });
    });
  }

  // استخراج public_id من رابط Cloudinary
  function extractPublicId(url) {
    if (!url) return null;
    const match = url.match(/\/upload\/v\d+\/(.+?)\.\w+$/);
    return match ? match[1] : null;
  }

  // ==================== دوال Supabase ====================
  async function supabaseRequest(endpoint, options = {}) {
    const url = `${CONFIG.SUPABASE_URL}${endpoint}`;
    const headers = {
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };

    const config = {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    };

    try {
      const response = await fetch(url, config);
      if (response.status === 204) return null;
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || `خطأ ${response.status}`);
      return data;
    } catch (error) {
      console.error('Supabase error:', error);
      throw error;
    }
  }

  async function uploadImage(index, file) {
    if (!file) return;
    
    // التحقق من الحجم والنوع
    if (file.size > 10 * 1024 * 1024) {
      showMessage('❌ حجم الصورة يتجاوز 10 ميجابايت', 'error');
      return;
    }
    if (!file.type.startsWith('image/')) {
      showMessage('❌ الملف ليس صورة', 'error');
      return;
    }
    
    // عرض حالة الرفع
    currentImages[index] = { uploading: true, progress: 0, file: file };
    renderImagesGrid();
    
    try {
      const result = await uploadToCloudinary(file, 'image', (progress) => {
        if (currentImages[index]?.uploading) {
          currentImages[index].progress = progress;
          renderImagesGrid();
        }
      });
      
      currentImages[index] = { url: result.secure_url, publicId: result.public_id };
      showMessage(`✅ تم رفع الصورة ${index + 1}`, 'success');
    } catch (error) {
      console.error('خطأ في رفع الصورة:', error);
      currentImages[index] = null;
      showMessage(`❌ فشل رفع الصورة ${index + 1}: ${error.message}`, 'error');
    }
    
    renderImagesGrid();
  }

  async function handleBulkImages(event) {
    const files = Array.from(event.target.files);
    event.target.value = '';
    
    for (const file of files) {
      // البحث عن أول فهرس فارغ
      const emptyIndex = currentImages.findIndex(img => !img || !img.url);
      if (emptyIndex === -1) {
        showMessage('⚠️ الحد الأقصى 10 صور', 'warning');
        break;
      }
      await uploadImage(emptyIndex, file);
    }
  }

  function cancelImageUpload(index) {
    // يمكن إضافة منطق إلغاء الرفع هنا
    if (currentImages[index]?.uploading) {
      currentImages[index] = null;
      renderImagesGrid();
      showMessage('تم إلغاء رفع الصورة', 'info');
    }
  }

  function setMainImage(index) {
    if (index === 0 || !currentImages[index]?.url) return;
    const temp = currentImages[0];
    currentImages[0] = currentImages[index];
    currentImages[index] = temp;
    renderImagesGrid();
    showMessage('✅ تم تعيين الصورة الرئيسية', 'success');
  }

  async function removeImage(index) {
    if (currentImages[index]?.publicId) {

    }
    currentImages[index] = null;

    showMessage('🗑️ تم حذف الصورة', 'info');
  }

  // ==================== CRUD العمليات ====================
  async function addOrUpdateProduct(event) {
    event.preventDefault();
    
    const category = document.getElementById('categoryName').value;
    const name = document.getElementById('productName').value.trim();
    const description = document.getElementById('productDescription').value;
    const price = document.getElementById('priceRange').value;
    const displayOrder = parseInt(document.getElementById('displayOrder').value) || 0;
    const isFeatured = document.getElementById('isFeatured').checked;
    const isActive = document.getElementById('isActive').checked;
    
    if (!category || !name) {
      showMessage('❌ الرجاء تعبئة الفئة واسم المنتج', 'error');
      return;
    }
    
    const mainImage = currentImages[0]?.url;
    if (!mainImage && !currentEditId) {
      showMessage('❌ الصورة الرئيسية مطلوبة', 'error');
      return;
    }
    
    const additionalImages = currentImages.slice(1).filter(img => img?.url).map(img => img.url);
    
    const productData = {
      category_name: category,
      product_name: name,
      product_description: description || null,
      price_range: price || null,
      display_order: displayOrder,
      is_featured: isFeatured,
      is_active: isActive,
      product_image_url: mainImage,
      additional_images: additionalImages,
      product_video_url: currentVideo?.url || null,
      colors: '[]',
      sizes: '[]',
      tags: '[]'
    };
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
    
    try {
      if (currentEditId) {
        await supabaseRequest(`/rest/v1/products?id=eq.${currentEditId}`, {
          method: 'PATCH',
          body: productData
        });
        showMessage('✅ تم تحديث المنتج بنجاح', 'success');
      } else {
        await supabaseRequest('/rest/v1/products', {
          method: 'POST',
          body: productData
        });
        showMessage('✅ تم إضافة المنتج بنجاح', 'success');
      }
      
      resetForm();
      loadProducts();
      switchTab('list');
    } catch (error) {
      showMessage(`❌ فشل الحفظ: ${error.message}`, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> إضافة المنتج';
    }
  }

  async function editProduct(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    currentEditId = id;
    document.getElementById('editId').value = id;
    document.getElementById('categoryName').value = product.category_name || '';
    document.getElementById('productName').value = product.product_name || '';
    document.getElementById('productDescription').value = product.product_description || '';
    document.getElementById('priceRange').value = product.price_range || '';
    document.getElementById('displayOrder').value = product.display_order || 0;
    document.getElementById('isFeatured').checked = product.is_featured || false;
    document.getElementById('isActive').checked = product.is_active !== false;
    
    // تحميل الصور
    currentImages = [];
    if (product.product_image_url) {
      currentImages[0] = { url: product.product_image_url, publicId: extractPublicId(product.product_image_url) };
    }
    if (product.additional_images) {
      product.additional_images.forEach((url, idx) => {
        if (idx + 1 < 10) {
          currentImages[idx + 1] = { url: url, publicId: extractPublicId(url) };
        }
      });
    }
    renderImagesGrid();
    
    // تحميل الفيديو
    if (product.product_video_url) {
      currentVideo = { url: product.product_video_url, publicId: extractPublicId(product.product_video_url) };
      const area = document.getElementById('videoUploadArea');
      area.innerHTML = `

          <source src="${product.product_video_url}" type="video/mp4">

    submitBtn.innerHTML = '<i class="fas fa-save"></i> تحديث المنتج';
    
    switchTab('add');
    showMessage('✏️ جارٍ تعديل المنتج', 'info');

  let deleteId = null;
  let deleteName = '';
  
  function openDeleteModal(id, name) {
    deleteId = id;
    deleteName = name;
    document.getElementById('deleteProductName').textContent = name;
    document.getElementById('deleteModal').classList.add('active');
  }
  
  function closeDeleteModal() {
    deleteId = null;
    document.getElementById('deleteModal').classList.remove('active');
  }
  
  async function confirmDelete() {
    if (!deleteId) return;
    
    closeDeleteModal();
    
    try {
      const product = allProducts.find(p => p.id === deleteId);
      await supabaseRequest(`/rest/v1/products?id=eq.${deleteId}`, { method: 'DELETE' });
      
      // حفظ للتراجع
      pendingDeletions.push({ id: deleteId, product: product });
      showUndoMessage(deleteName);
      
      loadProducts();
      showMessage('🗑️ تم حذف المنتج', 'success');
    } catch (error) {
      showMessage(`❌ فشل الحذف: ${error.message}`, 'error');
    }
    
    deleteId = null;
  }
  
  function showUndoMessage(productName) {
    const toast = document.getElementById('undoToast');
    document.getElementById('undoMessage').innerHTML = `تم حذف "${productName.substring(0, 30)}"`;
    toast.classList.add('show');
    
    if (undoTimeout) clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => {
      toast.classList.remove('show');
      pendingDeletions = [];
    }, 5000);
  }
  
  async function undoDelete() {
    const toast = document.getElementById('undoToast');
    toast.classList.remove('show');
    
    if (pendingDeletions.length > 0) {
      const lastDeleted = pendingDeletions.pop();
      if (lastDeleted && lastDeleted.product) {
        const { id, product } = lastDeleted;
        const { id: _, created_at, updated_at, ...productData } = product;
        
        try {
          await supabaseRequest('/rest/v1/products', { method: 'POST', body: productData });
          showMessage('✅ تم استعادة المنتج', 'success');
          loadProducts();
        } catch (error) {
          showMessage('❌ فشل استعادة المنتج', 'error');
        }
      }
    }
    
    if (undoTimeout) clearTimeout(undoTimeout);
  }
  
  // ==================== تصدير واستيراد ====================
  function exportProducts() {
    const dataStr = JSON.stringify(allProducts, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `products_${new Date().toISOString().slice(0, 19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showMessage('✅ تم تصدير المنتجات', 'success');
  }
  
  async function importProducts(file) {
    if (!file) return;
    
    try {
      const text = await file.text();
      const products = JSON.parse(text);
      let imported = 0;
      
      for (const product of products) {
        if (product.product_name) {
          const { id, created_at, updated_at, ...cleanProduct } = product;
          await supabaseRequest('/rest/v1/products', { method: 'POST', body: cleanProduct });
          imported++;
        }
      }
      
      showMessage(`✅ تم استيراد ${imported} منتج`, 'success');
      loadProducts();
    } catch (error) {
      showMessage(`❌ فشل الاستيراد: ${error.message}`, 'error');
    }
  }
  
  // ==================== دوال مساعدة ====================
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function switchTab(tab) {
    const addTab = document.getElementById('tab-add');
    const listTab = document.getElementById('tab-list');
    const btns = document.querySelectorAll('.tab-btn');
    
    if (tab === 'add') {
      addTab.classList.add('active');
      listTab.classList.remove('active');
      btns[0].classList.add('active');
      btns[1].classList.remove('active');
    } else {
      addTab.classList.remove('active');
      listTab.classList.add('active');
      btns[0].classList.remove('active');
      btns[1].classList.add('active');
      loadProducts();
    }
  }
  
  function filterProducts() {
    renderProductsTable();
  }
  
  // ==================== تهيئة الصفحة ====================
  document.getElementById('productForm').addEventListener('submit', addOrUpdateProduct);
  document.getElementById('searchInput')?.addEventListener('input', filterProducts);
  
  // التحقق من وجود CONFIG
  if (typeof CONFIG === 'undefined') {
    document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">❌ ملف config.js مفقود. الرجاء إنشاؤه.</div>';
  } else {
    loadCategories();
    loadProducts();
    renderImagesGrid();
  }
  
  // جعل الدوال عامة
  window.switchTab = switchTab;
  window.editProduct = editProduct;
  window.duplicateProduct = duplicateProduct;
  window.openDeleteModal = openDeleteModal;
  window.closeDeleteModal = closeDeleteModal;
  window.confirmDelete = confirmDelete;
  window.undoDelete = undoDelete;
  window.exportProducts = exportProducts;
  window.importProducts = importProducts;
  window.removeImage = removeImage;
  window.setMainImage = setMainImage;
  window.cancelImageUpload = cancelImageUpload;
  window.removeVideo = removeVideo;
  window.resetForm = resetForm;
  window.uploadImage = uploadImage;
  window.handleBulkImages = handleBulkImages;
  window.handleVideo = handleVideo;
</script>
