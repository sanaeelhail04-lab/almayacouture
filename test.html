<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إضافة منتج | لوحة التحكم</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0F0B08;
      --bg-secondary: #1A1510;
      --bg-card: #231D15;
      --gold: #C4A06A;
      --gold-light: #D4B896;
      --gold-dark: #A07840;
      --text-primary: #F5EDD8;
      --text-secondary: #A89880;
      --text-muted: #6B5F52;
      --border: rgba(196, 160, 106, 0.15);
      --border-hover: rgba(196, 160, 106, 0.4);
      --success: #25D366;
      --danger: #FF4757;
      --warning: #FFA502;
      --info: #3B82F6;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s ease;
    }

    body {
      background: var(--bg-primary);
      font-family: 'Tajawal', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* رأس الصفحة */
    .page-header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-header h1 {
      font-size: 1.5rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-actions {
      display: flex;
      gap: 0.8rem;
    }

    /* أزرار */
    .btn {
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #1A1510;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
    }

    .btn-outline:hover {
      background: rgba(196, 160, 106, 0.1);
    }

    .btn-save {
      background: linear-gradient(135deg, var(--success), #1da15f);
      color: white;
    }

    /* الحاوية الرئيسية */
    .product-form {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    /* العمود الرئيسي */
    .main-column {
      flex: 2;
      min-width: 250px;
    }

    /* العمود الجانبي */
    .sidebar-column {
      flex: 1;
      min-width: 280px;
    }

    /* البطاقات */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .card-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .card-header h3 {
      font-size: 1rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-header i.fa-chevron-down {
      transition: transform 0.3s;
      color: var(--text-muted);
    }

    .card-header.collapsed i.fa-chevron-down {
      transform: rotate(-90deg);
    }

    .card-body {
      padding: 1.2rem;
      transition: all 0.3s;
    }

    .card-body.collapsed {
      display: none;
    }

    /* الحقول */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-group label i {
      color: var(--gold);
      margin-left: 0.3rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* مجموعة السعر */
    .price-group {
      display: flex;
      gap: 1rem;
    }

    .price-group .form-group {
      flex: 1;
    }

    /* المتغيرات */
    .variants-section {
      margin-top: 1rem;
    }

    .variant-options {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .variant-option {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem;
      flex: 1;
    }

    .variant-option h4 {
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: var(--gold);
    }

    .variant-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .variant-tag {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .variant-tag:hover {
      border-color: var(--gold);
    }

    .variant-tag.selected {
      background: rgba(196, 160, 106, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    .add-value {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .add-value input {
      flex: 1;
      padding: 0.4rem 0.6rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.8rem;
    }

    .add-value button {
      padding: 0.4rem 0.8rem;
      background: var(--gold);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    /* جدول المتغيرات */
    .variants-table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }

    .variants-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .variants-table th,
    .variants-table td {
      padding: 0.6rem;
      border: 1px solid var(--border);
      text-align: center;
    }

    .variants-table th {
      background: var(--bg-secondary);
      color: var(--gold);
    }

    .variants-table input {
      width: 100%;
      padding: 0.3rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      text-align: center;
    }

    .generate-btn {
      background: var(--gold);
      color: #1A1510;
      border: none;
      border-radius: var(--radius);
      padding: 0.5rem 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* معرض الصور */
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.8rem;
    }

    .image-card {
      aspect-ratio: 1;
      background: var(--bg-secondary);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .image-card.has-image {
      border-style: solid;
    }

    .image-card.main-image {
      border-color: var(--gold);
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.3rem;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .image-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 0.3rem;
      display: flex;
      justify-content: center;
      gap: 0.3rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .image-card:hover .image-actions {
      opacity: 1;
    }

    .image-actions button {
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
    }

    .main-badge {
      position: absolute;
      top: 0.3rem;
      right: 0.3rem;
      background: var(--gold);
      color: #1A1510;
      font-size: 0.55rem;
      padding: 0.15rem 0.4rem;
      border-radius: 12px;
    }

    /* المنتجات ذات الصلة */
    .related-products {
      max-height: 300px;
      overflow-y: auto;
    }

    .related-product-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
    }

    .related-product-item:hover {
      background: rgba(196, 160, 106, 0.05);
    }

    .related-product-item img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    .related-product-item .info {
      flex: 1;
    }

    .related-product-item .name {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .related-product-item .price {
      font-size: 0.7rem;
      color: var(--gold);
    }

    .related-product-item.selected {
      background: rgba(196, 160, 106, 0.1);
      border-color: var(--gold);
    }

    /* خيارات متقدمة */
    .advanced-options {
      display: none;
    }

    .advanced-options.show {
      display: block;
    }

    /* رسائل */
    .message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      z-index: 1000;
      display: none;
      animation: slideUp 0.3s ease;
      font-size: 0.85rem;
    }

    .message.success {
      background: rgba(37, 211, 102, 0.15);
      border-color: var(--success);
      color: var(--success);
    }

    .message.error {
      background: rgba(255, 71, 87, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* تحميل */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* استجابة */
    @media (max-width: 992px) {
      .admin-container {
        padding: 1rem;
      }
      .product-form {
        flex-direction: column;
      }
    }

    @media (max-width: 768px) {
      .price-group {
        flex-direction: column;
      }
      .variant-options {
        flex-direction: column;
      }
      .page-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="admin-container">
  <!-- رأس الصفحة -->
  <div class="page-header">
    <h1><i class="fas fa-plus-circle"></i> إضافة منتج</h1>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="resetForm()"><i class="fas fa-times"></i> إلغاء</button>
      <button class="btn btn-save" onclick="saveProduct()"><i class="fas fa-save"></i> حفظ</button>
    </div>
  </div>

  <div class="product-form">
    <!-- العمود الرئيسي -->
    <div class="main-column">
      
      <!-- المعلومات الأساسية -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-info-circle"></i> المعلومات الأساسية</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label><i class="fas fa-heading"></i> اسم المنتج</label>
            <input type="text" id="productName" placeholder="مثال: حذاء رياضي احترافي">
          </div>
          <div class="form-group">
            <label><i class="fas fa-align-left"></i> الوصف</label>
            <textarea id="description" rows="4" placeholder="وصف المنتج بالتفصيل..."></textarea>
          </div>
        </div>
      </div>

      <!-- التسعير -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-tag"></i> التسعير</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="price-group">
            <div class="form-group">
              <label><i class="fas fa-dollar-sign"></i> السعر</label>
              <input type="number" id="price" placeholder="0.00">
            </div>
            <div class="form-group">
              <label><i class="fas fa-chart-line"></i> مقارنة السعر</label>
              <input type="number" id="comparePrice" placeholder="السعر الأصلي">
            </div>
          </div>
        </div>
      </div>

      <!-- الصور -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-images"></i> الصور</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="images-grid" id="imagesGrid"></div>
          <button class="btn btn-outline" style="width: 100%; margin-top: 1rem;" onclick="document.getElementById('bulkImages').click()">
            <i class="fas fa-cloud-upload-alt"></i> رفع صور
          </button>
          <input type="file" id="bulkImages" accept="image/*" multiple style="display: none" onchange="handleBulkImages(event)">
        </div>
      </div>

      <!-- المتغيرات -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-palette"></i> المتغيرات</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="variants-section">
            <div class="variant-options">
              <div class="variant-option">
                <h4><i class="fas fa-palette"></i> الألوان</h4>
                <div class="variant-tags" id="colorsContainer">
                  <span class="variant-tag" data-value="أحمر" onclick="toggleVariantTag(this)">أحمر</span>
                  <span class="variant-tag" data-value="أزرق" onclick="toggleVariantTag(this)">أزرق</span>
                  <span class="variant-tag" data-value="أسود" onclick="toggleVariantTag(this)">أسود</span>
                  <span class="variant-tag" data-value="أبيض" onclick="toggleVariantTag(this)">أبيض</span>
                </div>
                <div class="add-value">
                  <input type="text" id="newColor" placeholder="لون جديد...">
                  <button onclick="addVariantValue('color')"><i class="fas fa-plus"></i></button>
                </div>
              </div>
              <div class="variant-option">
                <h4><i class="fas fa-ruler"></i> المقاسات</h4>
                <div class="variant-tags" id="sizesContainer">
                  <span class="variant-tag" data-value="XS" onclick="toggleVariantTag(this)">XS</span>
                  <span class="variant-tag" data-value="S" onclick="toggleVariantTag(this)">S</span>
                  <span class="variant-tag" data-value="M" onclick="toggleVariantTag(this)">M</span>
                  <span class="variant-tag" data-value="L" onclick="toggleVariantTag(this)">L</span>
                  <span class="variant-tag" data-value="XL" onclick="toggleVariantTag(this)">XL</span>
                </div>
                <div class="add-value">
                  <input type="text" id="newSize" placeholder="مقاس جديد...">
                  <button onclick="addVariantValue('size')"><i class="fas fa-plus"></i></button>
                </div>
              </div>
            </div>
            <button class="generate-btn" onclick="generateVariants()">
              <i class="fas fa-magic"></i> إشعاع المتغيرات
            </button>
            <div id="variantsContainer" style="display: none;">
              <div class="variants-table-wrapper">
                <table class="variants-table" id="variantsTable">
                  <thead>
                    <tr><th>المتغير</th><th>السعر</th><th>الكمية</th><th>SKU</th><th></th></tr>
                  </thead>
                  <tbody id="variantsBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- العمود الجانبي -->
    <div class="sidebar-column">
      
      <!-- إشعاع (حالة المنتج) -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-eye"></i> إشعاع</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label>حالة المنتج</label>
            <select id="visibility">
              <option value="active">منشور</option>
              <option value="draft">مسودة</option>
              <option value="hidden">مخفي</option>
            </select>
          </div>
          <div class="form-group">
            <label>منتج مميز</label>
            <select id="featured">
              <option value="false">لا</option>
              <option value="true">نعم</option>
            </select>
          </div>
        </div>
      </div>

      <!-- المنتجات ذات الصلة -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-link"></i> المنتجات ذات الصلة</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="form-group">
            <input type="text" id="searchProducts" placeholder="البحث عن المنتجات..." onkeyup="searchProducts()">
          </div>
          <div class="related-products" id="relatedProductsList">
            <!-- سيتم تحميل المنتجات هنا -->
            <div style="text-align: center; padding: 1rem; color: var(--text-muted);">
              <i class="fas fa-spinner fa-spin"></i> جاري التحميل...
            </div>
          </div>
        </div>
      </div>

      <!-- خيارات متقدمة -->
      <div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <h3><i class="fas fa-cog"></i> خيارات متقدمة</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label><i class="fas fa-barcode"></i> SKU</label>
            <input type="text" id="sku" placeholder="رمز المنتج">
          </div>
          <div class="form-group">
            <label><i class="fas fa-globe"></i> GTIN (الرقم العالمي)</label>
            <input type="text" id="gtin" placeholder="12-14 رقم">
          </div>
          <div class="form-group">
            <label><i class="fas fa-weight-hanging"></i> الوزن (كغ)</label>
            <input type="number" step="0.01" id="weight" placeholder="0.00">
          </div>
          <div class="form-group">
            <label><i class="fas fa-truck"></i> فئة الشحن</label>
            <select id="shippingClass">
              <option value="standard">شحن عادي</option>
              <option value="express">شحن سريع</option>
            </select>
          </div>
          <div class="form-group">
            <label><i class="fab fa-searchengin"></i> عنوان SEO</label>
            <input type="text" id="metaTitle" placeholder="عنوان محسن لمحركات البحث">
          </div>
          <div class="form-group">
            <label><i class="fas fa-align-left"></i> وصف SEO</label>
            <textarea id="metaDescription" rows="2" placeholder="وصف محسن لمحركات البحث"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="message" class="message"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div style="color: var(--gold);">جاري حفظ المنتج...</div>
</div>

<script src="config.js"></script>
<script>
  // المتغيرات العامة
  let currentImages = [];
  let selectedColors = new Set();
  let selectedSizes = new Set();
  let allProducts = [];
  let selectedRelatedProducts = [];

  // عرض الرسائل
  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = `message ${type}`;
    msg.style.display = 'block';
    setTimeout(() => {
      msg.style.display = 'none';
    }, 3000);
  }

  // فتح/غلق البطاقة
  function toggleCard(header) {
    const card = header.parentElement;
    const body = card.querySelector('.card-body');
    header.classList.toggle('collapsed');
    body.classList.toggle('collapsed');
  }

  // ========== الصور ==========
  function renderImagesGrid() {
    const grid = document.getElementById('imagesGrid');
    grid.innerHTML = '';
    
    for (let i = 0; i < 8; i++) {
      const img = currentImages[i];
      const card = document.createElement('div');
      card.className = 'image-card';
      if (img?.url) card.classList.add('has-image');
      if (i === 0 && img?.url) card.classList.add('main-image');
      
      if (img?.url) {
        card.innerHTML = `
          <img src="${img.url}">
          <div class="main-badge">${i === 0 ? 'رئيسية' : ''}</div>
          <div class="image-actions">
            ${i !== 0 ? '<button onclick="setMainImage(' + i + ')"><i class="fas fa-crown"></i></button>' : ''}
            <button onclick="removeImage(${i})"><i class="fas fa-trash"></i></button>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="image-placeholder" onclick="document.getElementById('imageInput${i}').click()">
            <i class="fas fa-plus-circle"></i>
            <span>صورة ${i + 1}</span>
          </div>
          <input type="file" id="imageInput${i}" accept="image/*" style="display: none" onchange="uploadImage(${i}, this.files[0])">
        `;
      }
      grid.appendChild(card);
    }
  }

  async function uploadImage(index, file) {
    if (!file) return;
    showMessage('جاري رفع الصورة...', 'info');
    
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', window.CONFIG.CLOUDINARY_UPLOAD_PRESET);
    formData.append('folder', 'products');

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${window.CONFIG.CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      currentImages[index] = { url: data.secure_url };
      renderImagesGrid();
      showMessage('تم رفع الصورة بنجاح', 'success');
    } catch (error) {
      showMessage('فشل رفع الصورة', 'error');
    }
  }

  async function handleBulkImages(event) {
    const files = Array.from(event.target.files);
    for (const file of files) {
      const emptyIndex = currentImages.findIndex(img => !img);
      if (emptyIndex === -1) break;
      await uploadImage(emptyIndex, file);
    }
    event.target.value = '';
  }

  function setMainImage(index) {
    if (index === 0) return;
    const temp = currentImages[0];
    currentImages[0] = currentImages[index];
    currentImages[index] = temp;
    renderImagesGrid();
    showMessage('تم تعيين الصورة الرئيسية', 'success');
  }

  function removeImage(index) {
    currentImages[index] = null;
    renderImagesGrid();
  }

  // ========== المتغيرات ==========
  function toggleVariantTag(tag) {
    tag.classList.toggle('selected');
    const value = tag.dataset.value;
    const parent = tag.parentElement.parentElement;
    
    if (parent.querySelector('h4').textContent.includes('الألوان')) {
      if (tag.classList.contains('selected')) {
        selectedColors.add(value);
      } else {
        selectedColors.delete(value);
      }
    } else {
      if (tag.classList.contains('selected')) {
        selectedSizes.add(value);
      } else {
        selectedSizes.delete(value);
      }
    }
  }

  function addVariantValue(type) {
    let input, container;
    if (type === 'color') {
      input = document.getElementById('newColor');
      container = document.getElementById('colorsContainer');
    } else {
      input = document.getElementById('newSize');
      container = document.getElementById('sizesContainer');
    }
    
    const value = input.value.trim();
    if (value && ![...container.querySelectorAll('.variant-tag')].some(t => t.dataset.value === value)) {
      const tag = document.createElement('span');
      tag.className = 'variant-tag';
      tag.dataset.value = value;
      tag.textContent = value;
      tag.onclick = () => toggleVariantTag(tag);
      container.appendChild(tag);
      input.value = '';
      showMessage(`تم إضافة ${value}`, 'success');
    }
  }

  function generateVariants() {
    const colors = [...selectedColors];
    const sizes = [...selectedSizes];
    
    if (colors.length === 0 && sizes.length === 0) {
      showMessage('الرجاء اختيار لون أو مقاس على الأقل', 'error');
      return;
    }
    
    const variants = [];
    if (colors.length > 0 && sizes.length > 0) {
      for (const color of colors) {
        for (const size of sizes) {
          variants.push({ name: `${size} - ${color}`, price: 0, stock: 0, sku: '' });
        }
      }
    } else if (colors.length > 0) {
      for (const color of colors) {
        variants.push({ name: color, price: 0, stock: 0, sku: '' });
      }
    } else {
      for (const size of sizes) {
        variants.push({ name: size, price: 0, stock: 0, sku: '' });
      }
    }
    
    displayVariants(variants);
    showMessage(`تم إنشاء ${variants.length} متغير`, 'success');
  }

  function displayVariants(variants) {
    const container = document.getElementById('variantsContainer');
    const tbody = document.getElementById('variantsBody');
    tbody.innerHTML = '';
    
    variants.forEach((v, i) => {
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${v.name}<input type="hidden" class="variant-name" value="${v.name}"></td>
        <td><input type="number" class="variant-price" placeholder="0.00" step="0.01" value="${v.price}"></td>
        <td><input type="number" class="variant-stock" placeholder="0" value="${v.stock}"></td>
        <td><input type="text" class="variant-sku" placeholder="SKU" value="${v.sku}"></td>
        <td><button onclick="this.closest('tr').remove()" style="background: var(--danger); color: white; border: none; border-radius: 5px; padding: 0.3rem 0.5rem;"><i class="fas fa-trash"></i></button></td>
      `;
    });
    
    container.style.display = 'block';
  }

  // ========== المنتجات ذات الصلة ==========
  async function loadRelatedProducts() {
    try {
      const res = await fetch(`${window.CONFIG.SUPABASE_URL}/rest/v1/products?select=id,product_name,regular_price,product_image_url&order=display_order`, {
        headers: {
          'apikey': window.CONFIG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${window.CONFIG.SUPABASE_ANON_KEY}`
        }
      });
      allProducts = await res.json();
      renderRelatedProducts();
    } catch (error) {
      document.getElementById('relatedProductsList').innerHTML = '<div style="text-align: center; padding: 1rem;">لا توجد منتجات</div>';
    }
  }

  function renderRelatedProducts(searchTerm = '') {
    const container = document.getElementById('relatedProductsList');
    let filtered = allProducts;
    if (searchTerm) {
      filtered = allProducts.filter(p => p.product_name?.toLowerCase().includes(searchTerm.toLowerCase()));
    }
    
    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align: center; padding: 1rem; color: var(--text-muted);">لا توجد نتائج</div>';
      return;
    }
    
    container.innerHTML = filtered.map(p => `
      <div class="related-product-item ${selectedRelatedProducts.includes(p.id) ? 'selected' : ''}" onclick="toggleRelatedProduct(${p.id})">
        <img src="${p.product_image_url || 'https://placehold.co/40x40'}" onerror="this.src='https://placehold.co/40x40'">
        <div class="info">
          <div class="name">${escapeHtml(p.product_name)}</div>
          <div class="price">${p.regular_price || 0} درهم</div>
        </div>
      </div>
    `).join('');
  }

  function searchProducts() {
    const term = document.getElementById('searchProducts').value;
    renderRelatedProducts(term);
  }

  function toggleRelatedProduct(id) {
    const index = selectedRelatedProducts.indexOf(id);
    if (index === -1) {
      selectedRelatedProducts.push(id);
    } else {
      selectedRelatedProducts.splice(index, 1);
    }
    renderRelatedProducts(document.getElementById('searchProducts').value);
  }

  // ========== حفظ المنتج ==========
  async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    if (!name) {
      showMessage('الرجاء إدخال اسم المنتج', 'error');
      document.getElementById('productName').focus();
      return;
    }
    
    // جمع المتغيرات
    const variants = [];
    document.querySelectorAll('#variantsBody tr').forEach(row => {
      variants.push({
        name: row.querySelector('.variant-name')?.value,
        price: parseFloat(row.querySelector('.variant-price')?.value) || 0,
        stock: parseInt(row.querySelector('.variant-stock')?.value) || 0,
        sku: row.querySelector('.variant-sku')?.value || ''
      });
    });
    
    const productData = {
      product_name: name,
      description: document.getElementById('description').value,
      regular_price: parseFloat(document.getElementById('price').value) || 0,
      compare_price: parseFloat(document.getElementById('comparePrice').value) || null,
      visibility: document.getElementById('visibility').value,
      is_featured: document.getElementById('featured').value === 'true',
      product_image_url: currentImages[0]?.url || null,
      additional_images: currentImages.slice(1).filter(img => img?.url).map(img => img.url),
      variants: JSON.stringify(variants),
      related_products: selectedRelatedProducts,
      sku: document.getElementById('sku').value,
      gtin: document.getElementById('gtin').value,
      weight: parseFloat(document.getElementById('weight').value) || 0,
      shipping_class: document.getElementById('shippingClass').value,
      meta_title: document.getElementById('metaTitle').value,
      meta_description: document.getElementById('metaDescription').value,
      is_active: document.getElementById('visibility').value === 'active'
    };
    
    showLoading(true);
    
    try {
      const res = await fetch(`${window.CONFIG.SUPABASE_URL}/rest/v1/products`, {
        method: 'POST',
        headers: {
          'apikey': window.CONFIG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${window.CONFIG.SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(productData)
      });
      
      if (res.ok) {
        showMessage('تم حفظ المنتج بنجاح', 'success');
        setTimeout(() => {
          window.location.href = 'admin-products.html';
        }, 1500);
      } else {
        throw new Error('فشل الحفظ');
      }
    } catch (error) {
      showMessage('فشل حفظ المنتج', 'error');
    }
    
    showLoading(false);
  }

  function showLoading(show) {
    const overlay = document.getElementById('loadingOverlay');
    if (show) {
      overlay.classList.add('active');
    } else {
      overlay.classList.remove('active');
    }
  }

  function resetForm() {
    if (confirm('هل أنت متأكد من إلغاء جميع التغييرات؟')) {
      window.location.reload();
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // التهيئة
  renderImagesGrid();
  loadRelatedProducts();
  
  // جعل الدوال عامة
  window.toggleCard = toggleCard;
  window.toggleVariantTag = toggleVariantTag;
  window.addVariantValue = addVariantValue;
  window.generateVariants = generateVariants;
  window.setMainImage = setMainImage;
  window.removeImage = removeImage;
  window.uploadImage = uploadImage;
  window.handleBulkImages = handleBulkImages;
  window.saveProduct = saveProduct;
  window.resetForm = resetForm;
  window.searchProducts = searchProducts;
  window.toggleRelatedProduct = toggleRelatedProduct;
</script>
</body>
</html>
