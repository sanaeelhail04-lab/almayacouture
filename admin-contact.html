<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرسائل | Almaya Couture</title>
    <link rel="icon" href="images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="config.js"></script>
    <script src="admin.js"></script>
    
    <style>
        /* ========== ألوان متوافقة مع الموقع ========== */
        :root {
            --gold: #C4A06A;
            --gold-light: #D4B896;
            --gold-dim: rgba(196,160,106,0.15);
            --bg: #1A1510;
            --bg2: #221C14;
            --card: #2A2218;
            --text: #E8DDD0;
            --text-secondary: #A89880;
            --text-muted: #6B5F52;
            --border: rgba(196,160,106,0.12);
            --success: #25D366;
            --danger: #FF4757;
            --warning: #FFA502;
            --info: #3B82F6;
        }
        
        body.white-theme {
            --gold: #A07840;
            --bg: #FDFCF8;
            --bg2: #F5F0E8;
            --card: #FFFFFF;
            --text: #2A2218;
            --text-secondary: #6B5F52;
            --text-muted: #8B7B68;
            --border: rgba(160,120,64,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .main-content { flex: 1; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-header .badge {
            display: inline-block;
            background: var(--gold-dim);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* ========== CARDS ========== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .stat-box:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            background: var(--gold-dim);
        }
        .stat-box.active {
            border-color: var(--gold);
            background: var(--gold-dim);
        }
        .stat-box i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .stat-box .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold);
        }
        .stat-box .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* ========== BUTTONS ========== */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--gold);
            color: #1A1510;
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--gold-dim);
        }
        .btn-danger {
            background: rgba(255,71,87,0.12);
            color: var(--danger);
            border: 1px solid rgba(255,71,87,0.2);
        }
        .btn-danger:hover {
            background: rgba(255,71,87,0.2);
            transform: translateY(-1px);
        }
        .btn-success {
            background: rgba(37,211,102,0.12);
            color: var(--success);
            border: 1px solid rgba(37,211,102,0.2);
        }
        .btn-success:hover {
            background: rgba(37,211,102,0.2);
            transform: translateY(-1px);
        }
        .btn-info {
            background: rgba(59,130,246,0.12);
            color: var(--info);
            border: 1px solid rgba(59,130,246,0.2);
        }
        .btn-info:hover {
            background: rgba(59,130,246,0.2);
            transform: translateY(-1px);
        }

        /* ========== TABLE ========== */
        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }
        th {
            text-align: right;
            padding: 1rem;
            background: var(--bg2);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        tr:hover td {
            background: var(--gold-dim);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-pending {
            background: rgba(255,165,2,0.15);
            color: var(--warning);
        }
        .status-read {
            background: rgba(37,211,102,0.15);
            color: var(--success);
        }
        .status-replied {
            background: rgba(59,130,246,0.15);
            color: var(--info);
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            color: var(--gold);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: var(--gold);
        }
        .detail-row {
            margin-bottom: 1rem;
        }
        .detail-label {
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .detail-value {
            font-size: 0.85rem;
            color: var(--text);
            background: var(--bg2);
            padding: 0.7rem;
            border-radius: 10px;
            line-height: 1.6;
            word-break: break-word;
        }

        /* ========== LOADER & EMPTY ========== */
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        /* ========== TOAST MESSAGE ========== */
        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.85rem;
            z-index: 1001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .toast-message.success { border-right: 3px solid var(--success); color: var(--success); }
        .toast-message.error { border-right: 3px solid var(--danger); color: var(--danger); }
        .toast-message.info { border-right: 3px solid var(--gold); color: var(--gold); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
            .container { padding: 1rem; }
            .stat-box { padding: 0.8rem; }
            .stat-box .number { font-size: 1.4rem; }
        }
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .page-header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="main-content">
        <div class="container">
            
            <div class="page-header">
                <div class="badge"><i class="fas fa-envelope"></i> إدارة الرسائل</div>
                <h1>رسائل التواصل</h1>
                <p>عرض وإدارة الرسائل الواردة من العملاء</p>
            </div>

            <div class="stats-row">
                <div class="stat-box active" data-filter="all" onclick="setFilter('all')">
                    <i class="fas fa-envelope"></i>
                    <div class="number" id="totalCount">0</div>
                    <div class="label">كل الرسائل</div>
                </div>
                <div class="stat-box" data-filter="pending" onclick="setFilter('pending')">
                    <i class="fas fa-clock"></i>
                    <div class="number" id="pendingCount">0</div>
                    <div class="label">قيد الانتظار</div>
                </div>
                <div class="stat-box" data-filter="read" onclick="setFilter('read')">
                    <i class="fas fa-check-circle"></i>
                    <div class="number" id="readCount">0</div>
                    <div class="label">مقروءة</div>
                </div>
                <div class="stat-box" data-filter="replied" onclick="setFilter('replied')">
                    <i class="fas fa-reply-all"></i>
                    <div class="number" id="repliedCount">0</div>
                    <div class="label">تم الرد</div>
                </div>
            </div>

            <div style="margin-bottom: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="btn btn-primary" onclick="loadMessages()">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
            </div>

            <div class="table-container">
                <div id="messagesTable">
                    <div class="loader"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- Modal التفاصيل -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-envelope-open-text"></i> تفاصيل الرسالة</h3>
                <button class="modal-close" onclick="closeDetailsModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <div class="toast-message" id="toastMessage"></div>

    <script src="header.js"></script>
    <script src="footer.js"></script>

    <script>
        // ========== التحقق من تسجيل الدخول ==========
        if (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }

        // ========== CONFIG ==========
        if (typeof CONFIG === 'undefined') {
            showToast('❌ CONFIG.js مفقود', 'error');
            throw new Error('CONFIG missing');
        }

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;
        let currentFilter = 'all';
        let allMessages = [];

        // ========== عرض الإشعارات ==========
        function showToast(text, type) {
            const toast = document.getElementById('toastMessage');
            if (!toast) return;
            toast.textContent = text;
            toast.className = `toast-message ${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }

        // ========== طلب Supabase ==========
        async function supabaseRequest(endpoint, opts = {}) {
            try {
                const url = `${SUPABASE_URL}${endpoint}`;
                const res = await fetch(url, {
                    method: opts.method || 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: opts.body ? JSON.stringify(opts.body) : undefined
                });
                
                if (res.status === 204) return null;
                if (res.status === 404) return [];
                
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.message || `خطأ ${res.status}`);
                }
                return data;
            } catch(e) {
                console.error('❌ خطأ:', e);
                throw e;
            }
        }

        // ========== تحميل الرسائل ==========
        async function loadMessages() {
            const container = document.getElementById('messagesTable');
            if (!container) return;
            
            container.innerHTML = '<div class="loader"></div>';
            
            try {
                const messages = await supabaseRequest('/rest/v1/contact_messages?select=*&order=created_at.desc');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>لا توجد رسائل</p>
                            <p style="font-size:0.7rem; margin-top:0.5rem;">الرسائل الواردة من العملاء ستظهر هنا</p>
                            <button class="btn btn-primary" style="margin-top:1rem;" onclick="loadMessages()">
                                <i class="fas fa-sync-alt"></i> تحديث
                            </button>
                        </div>
                    `;
                    updateStats([]);
                    return;
                }
                
                allMessages = messages;
                updateStats(allMessages);
                renderMessages();
                showToast(`✅ تم تحميل ${messages.length} رسالة`, 'success');
                
            } catch(e) {
                console.error('❌ خطأ:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>خطأ في تحميل البيانات</p>
                        <p style="font-size:0.7rem; margin-top:0.5rem;">${e.message}</p>
                        <button class="btn btn-primary" style="margin-top:1rem;" onclick="loadMessages()">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
                showToast('❌ خطأ في تحميل البيانات', 'error');
            }
        }

        // ========== تحديث الإحصائيات ==========
        function updateStats(messages) {
            const total = messages.length;
            const pending = messages.filter(m => m.status === 'pending').length;
            const read = messages.filter(m => m.status === 'read').length;
            const replied = messages.filter(m => m.status === 'replied').length;
            
            const elements = {
                totalCount: total,
                pendingCount: pending,
                readCount: read,
                repliedCount: replied
            };
            
            for (const [id, val] of Object.entries(elements)) {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            }
        }

        // ========== الحصول على نص الحالة ==========
        function getStatusText(status) {
            const statusMap = {
                'pending': 'قيد الانتظار',
                'read': 'مقروءة',
                'replied': 'تم الرد'
            };
            return statusMap[status] || 'قيد الانتظار';
        }

        // ========== تنسيق التاريخ ==========
        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('ar-MA', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch(e) {
                return dateString;
            }
        }

        // ========== تنسيق النص ==========
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== عرض الرسائل في الجدول ==========
        function renderMessages() {
            let filtered = [...allMessages];
            
            if (currentFilter === 'pending') {
                filtered = filtered.filter(m => m.status === 'pending');
            } else if (currentFilter === 'read') {
                filtered = filtered.filter(m => m.status === 'read');
            } else if (currentFilter === 'replied') {
                filtered = filtered.filter(m => m.status === 'replied');
            }
            
            const container = document.getElementById('messagesTable');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد رسائل في هذا التصنيف</p></div>`;
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المرسل</th>
                            <th>البريد الإلكتروني</th>
                            <th>الموضوع</th>
                            <th>الحالة</th>
                            <th>التاريخ</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map((msg, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                <td><strong>${escapeHtml(msg.name)}</strong></td>
                                <td>${escapeHtml(msg.email)}</td>
                                <td>${escapeHtml(msg.subject || 'بدون موضوع')}</td>
                                <td><span class="status-badge status-${msg.status}">${getStatusText(msg.status)}</span></td>
                                <td>${formatDate(msg.created_at)}</td>
                                <td style="white-space: nowrap;">
                                    <button class="btn btn-info" onclick="viewDetails(${msg.id})" style="padding:0.3rem 0.6rem;" title="عرض التفاصيل">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-danger" onclick="deleteMessage(${msg.id})" style="padding:0.3rem 0.6rem;" title="حذف">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            // تحديث الفلتر النشط
            document.querySelectorAll('.stat-box').forEach(box => {
                const filter = box.getAttribute('data-filter');
                if (filter === currentFilter) {
                    box.classList.add('active');
                } else {
                    box.classList.remove('active');
                }
            });
        }

        // ========== عرض التفاصيل ==========
        window.viewDetails = async function(id) {
            const message = allMessages.find(m => m.id === id);
            if (!message) return;
            
            // تحديث حالة القراءة إذا كانت قيد الانتظار
            if (message.status === 'pending') {
                try {
                    await supabaseRequest(`/rest/v1/contact_messages?id=eq.${id}`, {
                        method: 'PATCH',
                        body: { status: 'read', is_read: true }
                    });
                    message.status = 'read';
                    updateStats(allMessages);
                    renderMessages();
                } catch(e) {
                    console.log('خطأ:', e);
                }
            }
            
            const modal = document.getElementById('detailsModal');
            const content = document.getElementById('detailsContent');
            
            content.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-user"></i> الاسم الكامل</div>
                    <div class="detail-value">${escapeHtml(message.name)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</div>
                    <div class="detail-value">${escapeHtml(message.email)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-phone"></i> رقم الهاتف</div>
                    <div class="detail-value">${escapeHtml(message.phone) || 'غير مدخل'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-tag"></i> الموضوع</div>
                    <div class="detail-value">${escapeHtml(message.subject) || 'بدون موضوع'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-calendar"></i> تاريخ الإرسال</div>
                    <div class="detail-value">${formatDate(message.created_at)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-comment"></i> نص الرسالة</div>
                    <div class="detail-value" style="white-space: pre-wrap; max-height: 200px; overflow-y: auto;">${escapeHtml(message.message)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-info-circle"></i> الحالة الحالية</div>
                    <div class="detail-value"><span class="status-badge status-${message.status}">${getStatusText(message.status)}</span></div>
                </div>
                <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap;">
                    <button class="btn btn-outline" onclick="closeDetailsModal()"><i class="fas fa-times"></i> إغلاق</button>
                    ${message.status !== 'replied' ? `<button class="btn btn-success" onclick="markAsReplied(${message.id})"><i class="fas fa-check"></i> تم الرد</button>` : ''}
                </div>
            `;
            
            modal.classList.add('active');
        };
        
        // ========== إغلاق المودال ==========
        window.closeDetailsModal = function() {
            document.getElementById('detailsModal').classList.remove('active');
        };
        
        // ========== تحديث الحالة إلى تم الرد ==========
        window.markAsReplied = async function(id) {
            try {
                await supabaseRequest(`/rest/v1/contact_messages?id=eq.${id}`, {
                    method: 'PATCH',
                    body: { status: 'replied', is_read: true }
                });
                showToast('✅ تم تحديث حالة الرسالة إلى "تم الرد"', 'success');
                closeDetailsModal();
                await loadMessages();
            } catch(e) {
                showToast('❌ خطأ: ' + e.message, 'error');
            }
        };
        
        // ========== حذف رسالة ==========
        window.deleteMessage = async function(id) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذه الرسالة نهائياً؟')) return;
            
            try {
                await supabaseRequest(`/rest/v1/contact_messages?id=eq.${id}`, { method: 'DELETE' });
                showToast('🗑 تم حذف الرسالة بنجاح', 'success');
                await loadMessages();
            } catch(e) {
                showToast('❌ خطأ في الحذف: ' + e.message, 'error');
            }
        };
        
        // ========== تصفية الرسائل ==========
        window.setFilter = function(filter) {
            currentFilter = filter;
            renderMessages();
        };
        
        window.loadMessages = loadMessages;
        
        // ========== تحميل البيانات عند بدء التشغيل ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
        });
    </script>
</body>
</html>
