<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرسائل | Almaya Couture</title>
    <link rel="icon" href="images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="admin.js"></script>
    
    <style>
        :root {
            --gold: #C4A06A;
            --gold-light: #D4B896;
            --bg: #1A1510;
            --bg2: #0F0C09;
            --card: #2A2218;
            --text: #F5EDD8;
            --text-secondary: #A89880;
            --border: rgba(196,160,106,0.15);
            --border-hover: rgba(196,160,106,0.3);
            --success: #25D366;
            --danger: #FF4757;
            --warning: #FFA502;
            --info: #3B82F6;
        }
        
        body.white-theme {
            --gold: #A07840;
            --bg: #FDFCF8;
            --bg2: #F5F0E8;
            --card: #FFFFFF;
            --text: #2A2218;
            --text-secondary: #6B5F52;
            --border: rgba(160,120,64,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-header .badge {
            display: inline-block;
            background: rgba(196,160,106,0.15);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .stat-box:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
        }
        .stat-box.active {
            border-color: var(--gold);
            background: rgba(196,160,106,0.05);
        }
        .stat-box i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .stat-box .number {
            font-size: 1.8rem;
            font-weight: 800;
        }
        .stat-box .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #1A1510;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .btn-danger {
            background: rgba(255,71,87,0.15);
            color: var(--danger);
            border: 1px solid rgba(255,71,87,0.3);
        }
        .btn-success {
            background: rgba(37,211,102,0.15);
            color: var(--success);
            border: 1px solid rgba(37,211,102,0.3);
        }
        .btn-info {
            background: rgba(59,130,246,0.15);
            color: var(--info);
            border: 1px solid rgba(59,130,246,0.3);
        }

        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th {
            text-align: right;
            padding: 1rem;
            background: var(--bg2);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        tr:hover td {
            background: rgba(196,160,106,0.03);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-pending {
            background: rgba(255,165,2,0.15);
            color: var(--warning);
        }
        .status-read {
            background: rgba(37,211,102,0.15);
            color: var(--success);
        }
        .status-replied {
            background: rgba(59,130,246,0.15);
            color: var(--info);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            color: var(--gold);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .detail-row {
            margin-bottom: 1rem;
        }
        .detail-label {
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .detail-value {
            font-size: 0.85rem;
            color: var(--text);
            background: var(--bg2);
            padding: 0.7rem;
            border-radius: 10px;
            line-height: 1.6;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.85rem;
            z-index: 1001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .message.success { border-right: 3px solid var(--success); color: var(--success); }
        .message.error { border-right: 3px solid var(--danger); color: var(--danger); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .theme-toggle-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card);
            border: 2px solid var(--border);
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 1rem; }
            .theme-toggle-btn { bottom: 20px; left: 20px; width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="page-header">
            <div class="badge"><i class="fas fa-envelope"></i> إدارة الرسائل</div>
            <h1>رسائل التواصل</h1>
            <p>عرض وإدارة الرسائل الواردة من العملاء</p>
        </div>

        <div class="stats-row">
            <div class="stat-box" onclick="setFilter('all')">
                <i class="fas fa-envelope"></i>
                <div class="number" id="totalCount">0</div>
                <div class="label">كل الرسائل</div>
            </div>
            <div class="stat-box" onclick="setFilter('pending')">
                <i class="fas fa-clock"></i>
                <div class="number" id="pendingCount">0</div>
                <div class="label">قيد الانتظار</div>
            </div>
            <div class="stat-box" onclick="setFilter('read')">
                <i class="fas fa-check-circle"></i>
                <div class="number" id="readCount">0</div>
                <div class="label">مقروءة</div>
            </div>
            <div class="stat-box" onclick="setFilter('replied')">
                <i class="fas fa-reply-all"></i>
                <div class="number" id="repliedCount">0</div>
                <div class="label">تم الرد</div>
            </div>
        </div>

        <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="loadMessages()">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
        </div>

        <div class="table-container" id="tableContainer">
            <div id="messagesTable">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <!-- Modal عرض التفاصيل -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-envelope-open-text"></i> تفاصيل الرسالة</h3>
                <button class="modal-close" onclick="closeDetailsModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <div class="message" id="message"></div>

    <button class="theme-toggle-btn" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <script src="header.js"></script>
    <script src="footer.js"></script>

    <script>
        // ========== THEME TOGGLE ==========
        (function() {
            const themeBtn = document.getElementById('themeToggle');
            function applySavedTheme() {
                const saved = localStorage.getItem('almaya-theme');
                if (saved === 'white') {
                    document.body.classList.add('white-theme');
                    themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    document.body.classList.remove('white-theme');
                    themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                }
            }
            function toggleTheme() {
                const isWhite = document.body.classList.contains('white-theme');
                if (isWhite) {
                    document.body.classList.remove('white-theme');
                    localStorage.setItem('almaya-theme', 'dark');
                    themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                } else {
                    document.body.classList.add('white-theme');
                    localStorage.setItem('almaya-theme', 'white');
                    themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                }
            }
            themeBtn.addEventListener('click', toggleTheme);
            applySavedTheme();
        })();

        // ========== CONFIG ==========
        if (typeof CONFIG === 'undefined') {
            document.body.innerHTML = '<div style="color:#FF4757;text-align:center;padding:2rem;">❌ CONFIG.js مفقود</div>';
            throw new Error('CONFIG missing');
        }

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;
        let currentFilter = 'all';
        let allMessages = [];

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        async function supabaseRequest(endpoint, opts = {}) {
            try {
                const url = `${SUPABASE_URL}${endpoint}`;
                console.log('📡 طلب:', url);
                
                const res = await fetch(url, {
                    method: opts.method || 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: opts.body ? JSON.stringify(opts.body) : undefined
                });
                
                console.log('📊 حالة الاستجابة:', res.status);
                
                if (res.status === 204) return null;
                if (res.status === 404) return [];
                
                const data = await res.json();
                console.log('📦 البيانات المستلمة:', data);
                
                if (!res.ok) {
                    throw new Error(data.message || `خطأ ${res.status}`);
                }
                return data;
            } catch(e) {
                console.error('❌ خطأ في Supabase:', e);
                throw e;
            }
        }

        async function loadMessages() {
            const container = document.getElementById('messagesTable');
            container.innerHTML = '<div class="loader"></div>';
            
            try {
                console.log('🚀 جاري تحميل الرسائل...');
                
                // محاولة جلب البيانات من جدول contact_messages
                let messages = await supabaseRequest('/rest/v1/contact_messages?select=*&order=created_at.desc');
                
                // إذا لم يجد الجدول، جرب بأسماء أخرى
                if (!messages || messages.length === 0) {
                    console.log('⚠️ لا توجد رسائل في contact_messages، جاري التحقق من جداول أخرى...');
                    
                    // جرب اسم آخر للجدول
                    messages = await supabaseRequest('/rest/v1/contact_messages?select=*');
                    
                    if (!messages || messages.length === 0) {
                        console.log('⚠️ لا توجد رسائل في قاعدة البيانات');
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>لا توجد رسائل</p>
                                <p style="font-size:0.7rem; margin-top:0.5rem;">تأكد من إنشاء جدول contact_messages في Supabase</p>
                                <button class="btn btn-primary" style="margin-top:1rem;" onclick="loadMessages()">
                                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                                </button>
                            </div>
                        `;
                        updateStats([]);
                        return;
                    }
                }
                
                allMessages = messages;
                console.log('✅ تم تحميل', allMessages.length, 'رسالة');
                
                updateStats(allMessages);
                renderMessages();
                
            } catch(e) {
                console.error('❌ خطأ في التحميل:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>خطأ في تحميل البيانات</p>
                        <p style="font-size:0.7rem; margin-top:0.5rem;">${e.message}</p>
                        <button class="btn btn-primary" style="margin-top:1rem;" onclick="loadMessages()">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
                showMessage('خطأ في تحميل البيانات: ' + e.message, 'error');
            }
        }

        function updateStats(messages) {
            const total = messages.length;
            const pending = messages.filter(m => m.status === 'pending' || m.is_read === false).length;
            const read = messages.filter(m => m.status === 'read' || (m.is_read === true && m.status !== 'replied')).length;
            const replied = messages.filter(m => m.status === 'replied').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('readCount').textContent = read;
            document.getElementById('repliedCount').textContent = replied;
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': 'قيد الانتظار',
                'read': 'مقروءة',
                'replied': 'تم الرد'
            };
            return statusMap[status] || 'قيد الانتظار';
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-MA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderMessages() {
            let filtered = [...allMessages];
            
            if (currentFilter === 'pending') {
                filtered = filtered.filter(m => m.status === 'pending' || m.is_read === false);
            } else if (currentFilter === 'read') {
                filtered = filtered.filter(m => m.status === 'read' || (m.is_read === true && m.status !== 'replied'));
            } else if (currentFilter === 'replied') {
                filtered = filtered.filter(m => m.status === 'replied');
            }
            
            const container = document.getElementById('messagesTable');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد رسائل في هذا التصنيف</p></div>`;
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المرسل</th>
                            <th>البريد الإلكتروني</th>
                            <th>الموضوع</th>
                            <th>الحالة</th>
                            <th>التاريخ</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map((msg, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                <td><strong>${escapeHtml(msg.name)}</strong></td>
                                <td>${escapeHtml(msg.email)}</td>
                                <td>${escapeHtml(msg.subject)}</td>
                                <td><span class="status-badge status-${msg.status || 'pending'}">${getStatusText(msg.status)}</span></td>
                                <td>${formatDate(msg.created_at)}</td>
                                <td>
                                    <button class="btn btn-info" onclick="viewDetails(${msg.id})" style="padding:0.3rem 0.6rem;"><i class="fas fa-eye"></i></button>
                                    <button class="btn btn-danger" onclick="deleteMessage(${msg.id})" style="padding:0.3rem 0.6rem;"><i class="fas fa-trash-alt"></i></button>
                                </td>
                             </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // عرض التفاصيل
        window.viewDetails = function(id) {
            const message = allMessages.find(m => m.id === id);
            if (!message) return;
            
            // تحديث حالة القراءة
            if (!message.is_read && message.status !== 'replied') {
                supabaseRequest(`/rest/v1/contact_messages?id=eq.${id}`, {
                    method: 'PATCH',
                    body: { is_read: true, status: 'read' }
                }).catch(e => console.log(e));
            }
            
            const modal = document.getElementById('detailsModal');
            const content = document.getElementById('detailsContent');
            
            content.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-user"></i> الاسم</div>
                    <div class="detail-value">${escapeHtml(message.name)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</div>
                    <div class="detail-value">${escapeHtml(message.email)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-phone"></i> رقم الهاتف</div>
                    <div class="detail-value">${escapeHtml(message.phone) || 'غير مدخل'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-tag"></i> الموضوع</div>
                    <div class="detail-value">${escapeHtml(message.subject)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-calendar"></i> التاريخ</div>
                    <div class="detail-value">${formatDate(message.created_at)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-comment"></i> الرسالة</div>
                    <div class="detail-value" style="white-space: pre-wrap;">${escapeHtml(message.message)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label"><i class="fas fa-info-circle"></i> الحالة</div>
                    <div class="detail-value"><span class="status-badge status-${message.status || 'pending'}">${getStatusText(message.status)}</span></div>
                </div>
                <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1rem;">
                    <button class="btn btn-outline" onclick="closeDetailsModal()">إغلاق</button>
                    <button class="btn btn-success" onclick="markAsReplied(${message.id})"><i class="fas fa-check"></i> تم الرد</button>
                </div>
            `;
            
            modal.classList.add('active');
        };
        
        window.closeDetailsModal = function() {
            document.getElementById('detailsModal').classList.remove('active');
        };
        
        // تحديث حالة الرسالة إلى تم الرد
        window.markAsReplied = async function(id) {
            try {
                await supabaseRequest(`/rest/v1/contact_messages?id=eq.${id}`, {
                    method: 'PATCH',
                    body: { status: 'replied', is_read: true }
                });
                showMessage('تم تحديث حالة الرسالة إلى "تم الرد"', 'success');
                closeDetailsModal();
                loadMessages();
            } catch(e) {
                showMessage('خطأ: ' + e.message, 'error');
            }
        };
        
        // حذف رسالة
        window.deleteMessage = async function(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الرسالة؟')) return;
            
            try {
                await supabaseRequest(`/rest/v1/contact_messages?id=eq.${id}`, { method: 'DELETE' });
                showMessage('تم حذف الرسالة بنجاح', 'success');
                loadMessages();
            } catch(e) {
                showMessage('خطأ في الحذف: ' + e.message, 'error');
            }
        };
        
        // تصفية
        function setFilter(filter) {
            currentFilter = filter;
            renderMessages();
        }
        
        window.setFilter = setFilter;
        window.loadMessages = loadMessages;
        
        // التحقق من الجلسة
        if (sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
        
        // تحميل البيانات
        loadMessages();
    </script>
</body>
</html>
