<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الآراء | Almaya Couture</title>
  <link rel="icon" href="images/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="config.js"></script>
  <script src="admin.js"></script>
  
  <style>
    /* ========== ألوان متوافقة مع header.js و footer.js ========== */
    :root {
      --bg-primary: #1A1510;
      --bg-secondary: #221C14;
      --bg-card: #231D15;
      --gold: #C4A06A;
      --gold-light: #D4B896;
      --gold-dim: rgba(196,160,106,0.15);
      --text-primary: #E8DDD0;
      --text-secondary: #A89880;
      --text-muted: #6B5F52;
      --border: rgba(196,160,106,0.12);
      --success: #25D366;
      --danger: #FF4757;
      --warning: #FFA502;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* ========== WHITE THEME (متوافق مع header/footer) ========== */
    body.white-theme {
      --bg-primary: #FDFCF8;
      --bg-secondary: #F5F0E8;
      --bg-card: #FFFFFF;
      --gold: #A07840;
      --gold-light: #C4A06A;
      --gold-dim: rgba(160,120,64,0.12);
      --text-primary: #2A2218;
      --text-secondary: #6B5F52;
      --text-muted: #8B7B68;
      --border: rgba(160,120,64,0.12);
      --success: #25D366;
      --danger: #E74C3C;
      --warning: #E67E00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      font-family: 'Tajawal', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    .main-content { flex: 1; margin-top: 0.5rem; }

    .admin-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

    .admin-header { text-align: center; margin-bottom: 2.5rem; }
    .admin-header .icon-circle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 70px; height: 70px;
      background: var(--gold-dim);
      border: 1px solid var(--border); border-radius: 50%;
      margin-bottom: 1rem; font-size: 1.8rem; color: var(--gold);
      transition: var(--transition);
    }
    .admin-header h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; color: var(--text-primary); margin-bottom: 0.4rem; }
    .admin-header p { color: var(--text-secondary); font-size: 0.85rem; }

    /* ========== STATS CARDS ========== */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem; text-align: center;
      transition: var(--transition); cursor: pointer;
    }
    .stat-card:hover { border-color: var(--gold); transform: translateY(-3px); background: var(--gold-dim); }
    .stat-card.active { border-color: var(--gold); box-shadow: 0 0 20px rgba(196,160,106,0.15); background: var(--gold-dim); }
    .stat-number { font-size: 1.8rem; font-weight: 700; color: var(--gold); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; font-weight: 500; letter-spacing: 0.5px; }

    /* ========== MESSAGES ========== */
    .message {
      padding: 0.85rem 1.25rem; border-radius: var(--radius-sm);
      margin-bottom: 1.5rem; text-align: center; font-weight: 500;
      font-size: 0.85rem; display: none; animation: slideDown 0.3s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    .message.success { background: rgba(37,211,102,0.1); color: var(--success); border: 1px solid rgba(37,211,102,0.3); }
    .message.error { background: rgba(255,71,87,0.1); color: var(--danger); border: 1px solid rgba(255,71,87,0.3); }
    .message.info { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--border); }

    /* ========== FILTER BAR ========== */
    .filter-bar {
      display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
      background: var(--bg-secondary); padding: 0.5rem;
      border-radius: 12px; border: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 0.6rem 1.2rem; background: transparent; border: none;
      color: var(--text-secondary); font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border-radius: 8px; transition: var(--transition);
      font-family: inherit; display: flex; align-items: center; gap: 0.5rem;
    }
    .filter-tab.active { background: var(--gold-dim); color: var(--gold); }
    .filter-tab:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,0.05); }
    body.white-theme .filter-tab:hover:not(.active) { background: rgba(0,0,0,0.03); }
    .count-badge { 
      background: var(--gold-dim); padding: 0.2rem 0.6rem; 
      border-radius: 20px; font-size: 0.65rem; font-weight: 600;
    }
    .filter-tab.active .count-badge { background: var(--gold); color: var(--bg-primary); }

    /* ========== BUTTONS ========== */
    .btn {
      padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.7rem; font-weight: 600;
      cursor: pointer; transition: var(--transition); font-family: inherit; border: none;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .btn-approve { background: rgba(37,211,102,0.12); color: var(--success); border: 1px solid rgba(37,211,102,0.2); }
    .btn-approve:hover { background: rgba(37,211,102,0.2); transform: translateY(-1px); }
    .btn-reject { background: rgba(255,71,87,0.08); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }
    .btn-reject:hover { background: rgba(255,71,87,0.15); transform: translateY(-1px); }
    .btn-pend { background: rgba(255,165,2,0.08); color: var(--warning); border: 1px solid rgba(255,165,2,0.2); }
    .btn-pend:hover { background: rgba(255,165,2,0.15); transform: translateY(-1px); }
    .btn-delete { background: rgba(255,71,87,0.05); color: var(--danger); border: 1px solid rgba(255,71,87,0.1); }
    .btn-delete:hover { background: rgba(255,71,87,0.12); transform: translateY(-1px); }

    /* ========== REVIEW CARDS ========== */
    .reviews-list { display: flex; flex-direction: column; gap: 1rem; }
    .review-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem; transition: var(--transition);
    }
    .review-card:hover { transform: translateX(-3px); border-color: var(--gold); }
    .review-card.status-pending { border-right: 3px solid var(--warning); }
    .review-card.status-approved { border-right: 3px solid var(--success); }
    .review-card.status-rejected { opacity: 0.75; border-right: 3px solid var(--danger); }
    .review-text {
      color: var(--text-secondary); font-size: 0.85rem; line-height: 1.7;
      margin: 0.75rem 0; padding: 0.75rem;
      background: var(--gold-dim); border-radius: var(--radius-sm);
    }
    .review-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .review-name { font-weight: 600; color: var(--text-primary); font-size: 0.9rem; }
    .review-date { font-size: 0.65rem; color: var(--text-muted); }
    .review-badge { font-size: 0.7rem; font-weight: 600; }
    .stars { display: flex; gap: 0.2rem; margin: 0.5rem 0; }
    .stars i { font-size: 0.85rem; }
    .review-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 2rem;
      max-width: 420px; width: 90%; text-align: center;
    }
    .modal h3 { margin-bottom: 0.75rem; color: var(--text-primary); }
    .modal p { color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.85rem; }
    .review-preview {
      background: var(--gold-dim); padding: 0.75rem;
      border-radius: 8px; font-size: 0.8rem; margin-bottom: 1.5rem;
      color: var(--text-muted); word-break: break-word;
    }
    .btn-group { display: flex; gap: 0.75rem; justify-content: center; }

    /* ========== LOADER & EMPTY STATE ========== */
    .loader {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-radius: 50%; border-top-color: var(--gold);
      animation: spin 0.8s ease-in-out infinite; margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      text-align: center; padding: 3rem;
      color: var(--text-muted);
    }
    .empty-state i { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; display: block; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .admin-container { padding: 1rem 0.75rem 2rem; }
      .filter-bar { gap: 0.25rem; }
      .filter-tab { padding: 0.5rem 0.8rem; font-size: 0.7rem; }
      .review-card { padding: 1rem; }
      .review-actions { gap: 0.35rem; }
      .btn { padding: 0.4rem 0.7rem; font-size: 0.65rem; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-tab span:not(.count-badge) { display: none; }
      .filter-tab i { margin: 0; }
      .filter-tab { padding: 0.5rem; }
    }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <div class="main-content">
    <div class="admin-container">
      
      <div class="admin-header">
        <div class="icon-circle"><i class="fas fa-star"></i></div>
        <h1>إدارة آراء الزبائن</h1>
        <p>مراجعة، قبول، رفض أو حذف الآراء</p>
      </div>

      <div class="message" id="message"></div>

      <div class="stats-grid">
        <div class="stat-card active" data-filter="all" onclick="setFilter('all')">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label"><i class="fas fa-comments"></i> الكل</div>
        </div>
        <div class="stat-card" data-filter="approved" onclick="setFilter('approved')">
          <div class="stat-number" id="approvedCount">0</div>
          <div class="stat-label"><i class="fas fa-check-circle"></i> مقبولة</div>
        </div>
        <div class="stat-card" data-filter="pending" onclick="setFilter('pending')">
          <div class="stat-number" id="pendingCount">0</div>
          <div class="stat-label"><i class="fas fa-clock"></i> قيد الانتظار</div>
        </div>
        <div class="stat-card" data-filter="rejected" onclick="setFilter('rejected')">
          <div class="stat-number" id="rejectedCount">0</div>
          <div class="stat-label"><i class="fas fa-times-circle"></i> مرفوضة</div>
        </div>
      </div>

      <div class="filter-bar">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
          <i class="fas fa-list"></i> <span>الكل</span>
          <span class="count-badge" id="badgeAll">0</span>
        </button>
        <button class="filter-tab" data-filter="approved" onclick="setFilter('approved')">
          <i class="fas fa-check"></i> <span>مقبولة</span>
          <span class="count-badge" id="badgeApproved">0</span>
        </button>
        <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">
          <i class="fas fa-clock"></i> <span>قيد الانتظار</span>
          <span class="count-badge" id="badgePending">0</span>
        </button>
        <button class="filter-tab" data-filter="rejected" onclick="setFilter('rejected')">
          <i class="fas fa-times"></i> <span>مرفوضة</span>
          <span class="count-badge" id="badgeRejected">0</span>
        </button>
      </div>
      
      <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
        <button class="btn btn-outline" onclick="loadAllReviews()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>

      <div class="reviews-list" id="reviewsList">
        <div class="loader"></div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i> تأكيد الحذف</h3>
      <p>سيتم حذف هذا الرأي نهائياً.</p>
      <div class="review-preview" id="deleteReviewPreview"></div>
      <div class="btn-group">
        <button class="btn btn-delete" id="confirmDeleteBtn"><i class="fas fa-trash-alt"></i> نعم، احذف</button>
        <button class="btn btn-outline" onclick="closeDeleteModal()"><i class="fas fa-times"></i> إلغاء</button>
      </div>
    </div>
  </div>

  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script>
    // التحقق من تسجيل الدخول
    if (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('admin_logged_in') !== 'true') {
      window.location.href = 'login.html';
    }

    // ========== CONFIG ==========
    if (typeof CONFIG === 'undefined') {
      console.error('❌ CONFIG non trouvé');
      throw new Error('CONFIG missing');
    }
    const SUPABASE_URL = CONFIG.SUPABASE_URL;
    const SUPABASE_KEY = CONFIG.SUPABASE_ANON_KEY;
    
    let allReviews = [];
    let currentFilter = 'all';
    let deleteTargetId = null;

    // ========== REQUÊTES SUPABASE ==========
    async function supabaseRequest(endpoint, opts = {}) {
      const res = await fetch(`${SUPABASE_URL}${endpoint}`, {
        method: opts.method || 'GET',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json'
        },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      if (res.status === 204 || res.status === 404) return null;
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || `Erreur ${res.status}`);
      return data;
    }

    // ========== ESCAPE HTML (SÉCURITÉ) ==========
    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/[&<>]/g, m => {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
        return map[m];
      });
    }

    // ========== CHARGER LES AVIS ==========
    async function loadAllReviews() {
      const listEl = document.getElementById('reviewsList');
      if (listEl) listEl.innerHTML = '<div class="loader"></div>';
      
      try {
        const data = await supabaseRequest('/rest/v1/reviews?select=*&order=created_at.desc');
        allReviews = data || [];
        updateStats();
        renderFilteredReviews();
      } catch(e) {
        console.error('❌ Erreur chargement:', e);
        showMessage('❌ فشل تحميل الآراء', 'error');
        if (listEl) listEl.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>حدث خطأ أثناء التحميل</p></div>';
      }
    }

    // ========== METTRE À JOUR LES STATS ==========
    function updateStats() {
      const total = allReviews.length;
      const approved = allReviews.filter(r => r.is_approved === true).length;
      const pending = allReviews.filter(r => r.is_approved === false).length;
      const rejected = allReviews.filter(r => r.is_approved === null).length;

      const elements = {
        totalCount: total, approvedCount: approved,
        pendingCount: pending, rejectedCount: rejected,
        badgeAll: total, badgeApproved: approved,
        badgePending: pending, badgeRejected: rejected
      };
      
      for (const [id, val] of Object.entries(elements)) {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      }
    }

    // ========== AFFICHER LES AVIS FILTRÉS ==========
    function renderFilteredReviews() {
      let filtered = [...allReviews];
      
      if (currentFilter === 'approved') filtered = filtered.filter(r => r.is_approved === true);
      else if (currentFilter === 'pending') filtered = filtered.filter(r => r.is_approved === false);
      else if (currentFilter === 'rejected') filtered = filtered.filter(r => r.is_approved === null);
      
      const listEl = document.getElementById('reviewsList');
      if (!listEl) return;
      
      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد آراء</p></div>`;
        return;
      }
      
      listEl.innerHTML = filtered.map(review => {
        const statusClass = review.is_approved === true ? 'status-approved' : (review.is_approved === null ? 'status-rejected' : 'status-pending');
        const badgeHtml = review.is_approved === true 
          ? '<span style="color:var(--success);"><i class="fas fa-check-circle"></i> مقبول</span>'
          : (review.is_approved === null 
            ? '<span style="color:var(--danger);"><i class="fas fa-times-circle"></i> مرفوض</span>'
            : '<span style="color:var(--warning);"><i class="fas fa-clock"></i> قيد الانتظار</span>');
        
        const stars = Array(5).fill(0).map((_, i) => 
          `<i class="fas fa-star" style="color:${i < review.rating ? 'var(--gold)' : 'rgba(196,160,106,0.2)'};"></i>`
        ).join('');
        
        let actions = '';
        if (review.is_approved !== true) actions += `<button class="btn btn-approve" onclick="updateReview(${review.id},true)"><i class="fas fa-check"></i> قبول</button>`;
        if (review.is_approved !== null) actions += `<button class="btn btn-reject" onclick="updateReview(${review.id},null)"><i class="fas fa-times"></i> رفض</button>`;
        if (review.is_approved === true || review.is_approved === null) actions += `<button class="btn btn-pend" onclick="updateReview(${review.id},false)"><i class="fas fa-clock"></i> تعليق</button>`;
        actions += `<button class="btn btn-delete" onclick="openDeleteModal(${review.id},'${escapeHtml(review.name).replace(/'/g, "\\'")}')"><i class="fas fa-trash-alt"></i> حذف</button>`;
        
        return `
          <div class="review-card ${statusClass}">
            <div class="review-meta">
              <div>
                <span class="review-name">${escapeHtml(review.name)}</span>
                <div class="review-date">${review.created_at ? new Date(review.created_at).toLocaleDateString('ar-MA') : ''}</div>
              </div>
              <div class="review-badge">${badgeHtml}</div>
            </div>
            <div class="stars">${stars}</div>
            <div class="review-text">${escapeHtml(review.text)}</div>
            <div class="review-actions">${actions}</div>
          </div>
        `;
      }).join('');
    }

    // ========== METTRE À JOUR UN AVIS ==========
    window.updateReview = async function(id, status) {
      try {
        await supabaseRequest(`/rest/v1/reviews?id=eq.${id}`, {
          method: 'PATCH',
          body: { is_approved: status }
        });
        showMessage(status === true ? '✓ تم قبول الرأي' : (status === null ? '✗ تم رفض الرأي' : '⏳ تم تعليق الرأي'), 'success');
        await loadAllReviews();
      } catch(e) {
        showMessage('❌ حدث خطأ', 'error');
      }
    };

    // ========== MODAL DE SUPPRESSION ==========
    window.openDeleteModal = function(id, name) {
      deleteTargetId = id;
      const previewEl = document.getElementById('deleteReviewPreview');
      if (previewEl) previewEl.textContent = `حذف رأي: ${name}`;
      const modal = document.getElementById('deleteModal');
      if (modal) modal.classList.add('active');
    };
    
    window.closeDeleteModal = function() {
      deleteTargetId = null;
      const modal = document.getElementById('deleteModal');
      if (modal) modal.classList.remove('active');
    };
    
    async function confirmDelete() {
      if (!deleteTargetId) return;
      try {
        await supabaseRequest(`/rest/v1/reviews?id=eq.${deleteTargetId}`, { method: 'DELETE' });
        showMessage('🗑 تم حذف الرأي بنجاح', 'success');
        closeDeleteModal();
        await loadAllReviews();
      } catch(e) {
        showMessage('❌ فشل الحذف', 'error');
      }
    }

    // ========== FILTRES ==========
    window.setFilter = function(filter) {
      currentFilter = filter;
      
      document.querySelectorAll('.stat-card, .filter-tab').forEach(el => {
        if (el.dataset && el.dataset.filter === filter) el.classList.add('active');
        else el.classList.remove('active');
      });
      
      renderFilteredReviews();
    };

    // ========== MESSAGE TOAST ==========
    function showMessage(text, type) {
      const msgEl = document.getElementById('message');
      if (!msgEl) return;
      msgEl.textContent = text;
      msgEl.className = `message ${type}`;
      msgEl.style.display = 'block';
      setTimeout(() => {
        msgEl.style.display = 'none';
      }, 4000);
    }

    // ========== EXPOSER LES FONCTIONS GLOBALES ==========
    window.loadAllReviews = loadAllReviews;

    // ========== INITIALISATION ==========
    document.addEventListener('DOMContentLoaded', () => {
      loadAllReviews();
      
      const confirmBtn = document.getElementById('confirmDeleteBtn');
      if (confirmBtn) confirmBtn.addEventListener('click', confirmDelete);
      
      const modal = document.getElementById('deleteModal');
      if (modal) {
        modal.addEventListener('click', e => {
          if (e.target.id === 'deleteModal') closeDeleteModal();
        });
      }
      
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeDeleteModal();
      });
    });
  </script>
</body>
</html>
